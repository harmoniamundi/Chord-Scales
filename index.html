<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chord Scales Machine</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.10/tailwindcss.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --panel-2: #222222;
            --panel-3: #252525;
            --border: #333333;
            --muted: #94a3b8;
            --text: #f8fafc;
            --blue: #2563eb;
            --blue-soft: rgba(37, 99, 235, 0.2);
            --rose-soft: rgba(244, 63, 94, 0.18);
            --amber-soft: rgba(245, 158, 11, 0.18);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: var(--bg);
        }

        button {
            font: inherit;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--panel);
        }

        .titlebar {
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            border-bottom: 1px solid var(--border);
            background: #282828;
        }

        .content-shell {
            display: flex;
            flex: 1;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }

        .sidebar {
            width: 380px;
            flex: 0 0 380px;
            background: var(--panel-2);
            border-right: 1px solid var(--border);
            padding: 1rem;
            overflow-y: auto;
        }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            background: var(--panel);
        }

        .panel-card {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 16px;
            padding: 1rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .muted-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #7dd3fc;
            font-weight: 700;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #cbd5e1;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 0.2rem 0.5rem;
            font-size: 10px;
            font-weight: 700;
            line-height: 1.4;
        }

        .tag-blue { background: rgba(37,99,235,0.18); color: #bfdbfe; }
        .tag-purple { background: rgba(168,85,247,0.18); color: #e9d5ff; }
        .tag-rose { background: rgba(244,63,94,0.18); color: #fecdd3; }
        .tag-amber { background: rgba(245,158,11,0.18); color: #fde68a; }

        .chip {
            border: 1px solid var(--border);
            border-radius: 0.7rem;
            background: rgba(255,255,255,0.02);
            color: #e2e8f0;
            transition: 160ms ease;
        }

        .chip:hover {
            background: rgba(255,255,255,0.04);
        }

        .chip-active {
            background: rgba(58, 89, 180, 0.22);
            color: white;
            border-color: rgba(59,130,246,0.8);
            box-shadow: 0 1px 0 rgba(255,255,255,0.04);
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 0.6rem;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.02);
            color: #e2e8f0;
            transition: 160ms ease;
            cursor: pointer;
        }

        .btn-icon:hover {
            background: rgba(255,255,255,0.06);
        }

        .btn-icon.active {
            background: rgba(37,99,235,0.75);
            border-color: rgba(96,165,250,0.9);
            color: white;
        }

        .root-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 0.375rem;
        }

        .quality-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.375rem;
        }

        .pill-button {
            border: 1px solid var(--border);
            border-radius: 0.7rem;
            background: rgba(255,255,255,0.02);
            color: #cbd5e1;
            transition: 140ms ease;
            cursor: pointer;
        }

        .pill-button:hover {
            color: white;
        }

        .pill-button.active {
            background: rgba(37,99,235,0.25);
            color: white;
            border-color: rgba(96,165,250,0.85);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: #252525;
        }

        .toggle-btn {
            appearance: none;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: #cbd5e1;
            border-radius: 0.55rem;
            padding: 0.15rem 0.5rem;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 120ms ease;
        }

        .toggle-btn[aria-pressed="true"] {
            border-color: rgba(96,165,250,0.7);
            color: #dbeafe;
            background: rgba(59,130,246,0.18);
        }

        .mode-group {
            display: inline-flex;
            gap: 0.25rem;
            padding: 0.2rem;
            border-radius: 0.8rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
        }

        .mode-button {
            border: 0;
            border-radius: 0.55rem;
            background: transparent;
            color: #cbd5e1;
            padding: 0.35rem 0.7rem;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 120ms ease;
        }

        .mode-button.active {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        #scales-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem;
            padding: 1.25rem;
            overflow-y: auto;
            min-height: 0;
        }

        .scale-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .scale-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .scale-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 0.2rem 0.45rem;
            font-size: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: #cbd5e1;
        }

        .scale-body {
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
        }

        .note-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        .note-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.25rem;
            padding: 0.35rem 0.45rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(15,23,42,0.42);
            color: #e2e8f0;
            font-size: 11px;
            font-weight: 700;
            font-family: "SF Mono", Menlo, monospace;
            cursor: pointer;
            transition: 120ms ease;
        }

        .note-badge:hover {
            background: rgba(37,99,235,0.2);
        }

        .note-badge.avoid {
            background: rgba(244,63,94,0.18);
            border-color: rgba(244,63,94,0.42);
            color: #fecdd3;
        }

        .note-badge.char { background: rgba(245,158,11,0.18); border-color: rgba(245,158,11,0.42); color: #fde68a; }
        .note-badge.target { background: rgba(37,99,235,0.25); border-color: rgba(96,165,250,0.8); color: white; }

        .staff-visual {
            position: relative;
            border-radius: 0.8rem;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.97);
            height: 140px;
            overflow: hidden;
            cursor: pointer;
        }

        .staff-lines {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: none;
        }

        .staff-lines span {
            display: block;
            height: 1px;
            background: rgba(15, 23, 42, 0.6);
            margin: 0 0.75rem;
        }

        .staff-note {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2563eb;
            box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
            transform: translate(-50%, -50%);
        }

        .staff-note.avoid {
            background: #ef4444;
            box-shadow: 0 0 0 2px rgba(239,68,68,0.2);
        }

        .staff-note.char {
            background: #f59e0b;
            box-shadow: 0 0 0 2px rgba(245,158,11,0.2);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body class="bg-[#121212] text-slate-100 selection:bg-blue-500 selection:text-white">
    <div class="app-shell">
        <header class="titlebar">
            <div class="flex items-center space-x-2">
                <span class="text-xs font-semibold text-slate-300">Chord Scales Machine</span>
            </div>
        </header>

        <div class="content-shell">
            <aside class="sidebar custom-scrollbar">
                <div class="panel-card">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="muted-label">Accord actuel</span>
                            <div id="display-chord-name" class="text-2xl font-bold tracking-tight text-white mt-0.5">Cmaj7</div>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button id="play-chord-btn" type="button" class="btn-icon" aria-label="Jouer l'accord" title="Jouer l'accord">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                            <button id="play-arp-btn" type="button" class="btn-icon" aria-label="Jouer l'arpège" title="Jouer l'arpège">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5v14M5 12h14"/></svg>
                            </button>
                            <button id="loop-chord-btn" type="button" class="btn-icon" aria-label="Activer la boucle" title="Activer la boucle">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A7 7 0 0 0 10 4H4m16 16v-5h-.582m-15.356-2A7 7 0 0 0 14 20h6"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="mt-3 pt-2.5 border-t border-[#3a3a3c]">
                        <span class="text-[10px] text-slate-400 block mb-1">Notes :</span>
                        <div id="display-chord-notes" class="flex flex-wrap gap-1" aria-live="polite"></div>
                    </div>
                </div>

                <div class="space-y-2 mt-5">
                    <div class="flex justify-between items-center px-1">
                        <span class="section-label">Tonalité instrumentale</span>
                        <span id="selected-transposition-badge" class="tag tag-purple">Bb</span>
                    </div>
                    <div class="flex bg-[#1a1a1a] p-1 rounded-lg text-xs font-medium border border-[#333333]">
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition active" data-key="Bb">Bb</button>
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition" data-key="C">C</button>
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition" data-key="Eb">Eb</button>
                    </div>
                </div>

                <div class="space-y-2 mt-5">
                    <div class="flex justify-between items-center px-1">
                        <span class="section-label">1. Fondamentale</span>
                        <span id="selected-root-badge" class="tag tag-blue">C</span>
                    </div>
                    <div id="root-buttons-container" class="root-grid"></div>
                </div>

                <div class="space-y-2 mt-5">
                    <div class="flex justify-between items-center px-1">
                        <span class="section-label">2. Qualité</span>
                        <span id="selected-quality-badge" class="tag tag-purple">maj7</span>
                    </div>
                    <div class="flex bg-[#1a1a1a] p-1 rounded-lg text-xs font-medium border border-[#333333]">
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition active" data-cat="maj">Maj</button>
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition" data-cat="min">Min</button>
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition" data-cat="dom">Dom</button>
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition" data-cat="other">Autre</button>
                    </div>
                    <div id="quality-buttons-container" class="quality-grid pt-1"></div>
                </div>
            </aside>

            <main class="main-panel">
                <div class="toolbar">
                    <div class="flex items-center gap-2 flex-wrap">
                        <h2 class="text-sm font-bold text-white">Gammes compatibles</h2>
                        <span id="scales-count-badge" class="tag tag-blue">0 gammes</span>
                        <button id="btn-toggle-target" type="button" class="toggle-btn" aria-pressed="false">Notes ciblées</button>
                        <button id="btn-toggle-avoid" type="button" class="toggle-btn" aria-pressed="false">Notes à éviter</button>
                        <button id="btn-toggle-characteristic" type="button" class="toggle-btn" aria-pressed="false">Note caractéristique</button>
                    </div>

                    <div class="ml-auto">
                        <div class="mode-group">
                            <button type="button" class="mode-button active" data-mode="staff">Portée</button>
                            <button type="button" class="mode-button" data-mode="intervals">Intervalles</button>
                            <button type="button" class="mode-button" data-mode="notes">Notes</button>
                            <button type="button" class="mode-button" data-mode="letters">Lettres</button>
                        </div>
                    </div>
                </div>

                <div id="scales-container" class="custom-scrollbar" aria-live="polite"></div>
            </main>
        </div>
    </div>

    <script>
        const rootLabels = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
        const NOTE_NAMES_SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const NOTE_NAMES_FLAT = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
        const NATURAL_SEMITONES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

        const scaleDb = {
            ionian: { name: "Ionien (Gamme majeure)", category: "Diatonique", intervals: [0, 2, 4, 5, 7, 9, 11], characteristicInterval: 11, desc: "Utilisé sur le degré I. La quarte frotte avec la tierce majeure et la dominante en jazz moderne." },
            lydian: { name: "Lydien", category: "Diatonique / Majeur", intervals: [0, 2, 4, 6, 7, 9, 11], characteristicInterval: 6, desc: "Choix principal en jazz moderne pour éviter la quarte juste dissonante." },
            lydianAug: { name: "Lydien Augmenté", category: "Mineur Mélodique", intervals: [0, 2, 4, 6, 8, 9, 11], characteristicInterval: 8, desc: "Sur Maj7#5 (degré III du mineur mélodique)." },
            harmonicMajor: { name: "Majeur Harmonique", category: "Emprunt Modal", intervals: [0, 2, 4, 5, 7, 8, 11], characteristicInterval: 8, desc: "Sert aux emprunts modaux pour apporter une couleur sombre." },
            majorBebop: { name: "Gamme Bebop Majeure", category: "Bebop", intervals: [0, 2, 4, 5, 7, 8, 9, 11], characteristicInterval: 8, desc: "Ajoute un chromatisme entre la quinte et la septième majeure." },
            majorPentatonic: { name: "Pentatonique Majeure", category: "Pentatonique", intervals: [0, 2, 4, 7, 9], characteristicInterval: 9, desc: "Retire les demi-tons pour une sonorité ouverte et consonante." },
            majorBlues: { name: "Gamme Blues Majeure", category: "Blues", intervals: [0, 2, 3, 4, 7, 9], characteristicInterval: 3, desc: "Introduit la tierce mineure comme approche chromatique." },
            dorian: { name: "Dorien", category: "Diatonique / Mineur", intervals: [0, 2, 3, 5, 7, 9, 10], characteristicInterval: 9, desc: "Degré II. La sixte majeure stabilise l'accord." },
            melodicMinor: { name: "Mineur Mélodique", category: "Mineur Mélodique", intervals: [0, 2, 3, 5, 7, 9, 11], characteristicInterval: 11, desc: "Sur mMaj7 ou m6. Accord de tonique mineure de référence." },
            aeolian: { name: "Éolien (Mineur naturel)", category: "Diatonique / Mineur", intervals: [0, 2, 3, 5, 7, 8, 10], characteristicInterval: 8, desc: "Degré VI. La b6 frotte contre la quinte et la dominante." },
            phrygian: { name: "Phrygien", category: "Diatonique / Mineur", intervals: [0, 1, 3, 5, 7, 8, 10], characteristicInterval: 1, desc: "Degré III. Très dissonant." },
            harmonicMinor: { name: "Mineur Harmonique", category: "Mineur Harmonique", intervals: [0, 2, 3, 5, 7, 8, 11], characteristicInterval: 11, desc: "Sur mMaj7 avec une couleur classique marquée." },
            minorBebop: { name: "Bebop Mineure (Dorienne)", category: "Bebop", intervals: [0, 2, 3, 5, 7, 9, 10, 11], characteristicInterval: 11, desc: "Ajoute la septième majeure comme chromatisme de passage." },
            minorPentatonic: { name: "Pentatonique Mineure", category: "Pentatonique", intervals: [0, 3, 5, 7, 10], characteristicInterval: 3, desc: "Choix standard, élimine les risques de frottement." },
            bluesScale: { name: "Gamme Blues", category: "Pentatonique / Blues", intervals: [0, 3, 5, 6, 7, 10], characteristicInterval: 6, desc: "L'ajout de la blue note crée de la tension sans changer la nature mineure." },
            mixolydian: { name: "Mixolydien", category: "Diatonique / Dominant", intervals: [0, 2, 4, 5, 7, 9, 10], characteristicInterval: 10, desc: "Sur un V7 classique non altéré." },
            lydianDominant: { name: "Lydien Dominant (Lydien b7)", category: "Mineur Mélodique", intervals: [0, 2, 4, 6, 7, 9, 10], characteristicInterval: 6, desc: "Pour les V7 qui ne résolvent pas en quinte juste." },
            altered: { name: "Altéré (Super Locrien)", category: "Mineur Mélodique", intervals: [0, 1, 3, 4, 6, 8, 10], characteristicInterval: 1, desc: "Pour V7 résolvant sur un I. Contient toutes les altérations de la dominante." },
            mixolydianFlat13: { name: "Mixolydien b13", category: "Mineur Mélodique", intervals: [0, 2, 4, 5, 7, 8, 10], characteristicInterval: 8, desc: "5e mode du mineur mélodique." },
            phrygianDominant: { name: "Phrygien Dominant", category: "Mineur Harmonique", intervals: [0, 1, 4, 5, 7, 8, 10], characteristicInterval: 1, desc: "Pour V7 vers un accord mineur." },
            mixolydianFlat9: { name: "Mixolydien b9", category: "Majeur Harmonique", intervals: [0, 1, 4, 5, 7, 9, 10], characteristicInterval: 1, desc: "5e mode du majeur harmonique." },
            dominantBebop: { name: "Bebop Dominante", category: "Bebop", intervals: [0, 2, 4, 5, 7, 9, 10, 11], characteristicInterval: 11, desc: "Chromatisme entre la septième mineure et la fondamentale." },
            halfWholeDim: { name: "Demi-Ton / Ton (Octatonique)", category: "Symétrique", intervals: [0, 1, 3, 4, 6, 7, 9, 10], characteristicInterval: 1, desc: "Sur accords 7b9 ou 7#9, garde la quinte juste et la tension." },
            wholeTone: { name: "Par Tons (Hexatonique)", category: "Symétrique", intervals: [0, 2, 4, 6, 8, 10], characteristicInterval: 6, desc: "Sur les accords 7#5, sans 9ème altérée." },
            locrianSharp2: { name: "Locrien bécarre 2", category: "Mineur Mélodique", intervals: [0, 2, 3, 5, 6, 8, 10], characteristicInterval: 2, desc: "Choix moderne par défaut sur le degré II d'un mineur mélodique." },
            locrian: { name: "Locrien", category: "Diatonique", intervals: [0, 1, 3, 5, 6, 8, 10], characteristicInterval: 1, desc: "Degré VII de la gamme majeure." },
            minorPentatonicFlat5: { name: "Pentatonique mineure b5", category: "Pentatonique", intervals: [0, 3, 5, 6, 10], characteristicInterval: 6, desc: "Version allégée du Locrien." },
            wholeHalfDim: { name: "Ton / Demi-Ton (Octatonique)", category: "Symétrique", intervals: [0, 2, 3, 5, 6, 8, 9, 11], characteristicInterval: 9, desc: "Option principale, couvre la structure symétrique d'un accord diminué." }
        };

        window.rootLabels = rootLabels;
        window.scaleDb = scaleDb;

        const chordTypes = {
            maj: [
                { id: "maj7", name: "maj7", fullName: "Majeur 7", notes: [0, 4, 7, 11], scales: [{ id: "lydian", role: "Principal (Moderne)" }, { id: "ionian", role: "Degré I" }, { id: "harmonicMajor", role: "Emprunt modal" }, { id: "majorBebop", role: "Rythme Bebop" }, { id: "majorPentatonic", role: "Consonance ouverte" }] },
                { id: "maj9", name: "maj9", fullName: "Majeur 9", notes: [0, 4, 7, 11, 2], scales: [{ id: "lydian", role: "Principal" }, { id: "ionian", role: "Degré I" }] },
                { id: "6", name: "6", fullName: "Sixte", notes: [0, 4, 7, 9], scales: [{ id: "ionian", role: "Principal" }, { id: "lydian", role: "Moderne" }, { id: "majorBebop", role: "Bebop" }, { id: "majorPentatonic", role: "Consonance" }] },
                { id: "maj7sharp11", name: "maj7(#11)", fullName: "Majeur 7 dièse 11", notes: [0, 4, 7, 11, 6], scales: [{ id: "lydian", role: "Principal" }, { id: "lydianAug", role: "Avancé" }] },
                { id: "maj7sharp5", name: "maj7(#5)", fullName: "Majeur 7 quinte augmentée", notes: [0, 4, 8, 11], scales: [{ id: "lydianAug", role: "Principal" }, { id: "majorBebop", role: "Alternatif" }] }
            ],
            min: [
                { id: "m7", name: "m7", fullName: "Mineur 7", notes: [0, 3, 7, 10], scales: [{ id: "dorian", role: "Principal (Degré II)" }, { id: "aeolian", role: "Degré VI (b6 frotte)" }, { id: "phrygian", role: "Désaccord" }, { id: "minorBebop", role: "Bebop" }] },
                { id: "m9", name: "m9", fullName: "Mineur 9", notes: [0, 3, 7, 10, 2], scales: [{ id: "dorian", role: "Principal" }, { id: "aeolian", role: "Secondaire" }] },
                { id: "m11", name: "m11", fullName: "Mineur 11", notes: [0, 3, 7, 10, 2, 5], scales: [{ id: "dorian", role: "Principal" }, { id: "aeolian", role: "Naturel" }] },
                { id: "mmaj7", name: "mMaj7", fullName: "Mineur/Majeur 7", notes: [0, 3, 7, 11], scales: [{ id: "melodicMinor", role: "Principal" }, { id: "harmonicMinor", role: "Classique" }] },
                { id: "m6", name: "m6", fullName: "Mineur 6", notes: [0, 3, 7, 9], scales: [{ id: "melodicMinor", role: "Principal" }, { id: "aeolian", role: "Alternatif" }] }
            ],
            dom: [
                { id: "7", name: "7", fullName: "Dominante 7", notes: [0, 4, 7, 10], scales: [{ id: "mixolydian", role: "Principal" }, { id: "bluesScale", role: "Blues" }, { id: "dominantBebop", role: "Bebop" }, { id: "phrygianDominant", role: "Altéré" }] },
                { id: "9", name: "9", fullName: "Dominante 9", notes: [0, 4, 7, 10, 2], scales: [{ id: "mixolydian", role: "Principal" }, { id: "dominantBebop", role: "Bebop" }] },
                { id: "7alt", name: "7alt", fullName: "Dominante altérée", notes: [0, 4, 7, 10, 1], scales: [{ id: "altered", role: "Principal" }, { id: "wholeTone", role: "Bricolage" }] },
                { id: "7b9", name: "7b9", fullName: "Dominante b9", notes: [0, 4, 7, 10, 1], scales: [{ id: "altered", role: "Principal" }, { id: "halfWholeDim", role: "Symétrique" }] },
                { id: "7sharp5", name: "7#5", fullName: "Dominante #5", notes: [0, 4, 8, 10], scales: [{ id: "wholeTone", role: "Principal" }, { id: "altered", role: "Altéré" }] }
            ],
            other: [
                { id: "dim7", name: "dim7", fullName: "Diminué 7", notes: [0, 3, 6, 9], scales: [{ id: "wholeHalfDim", role: "Principal" }, { id: "halfWholeDim", role: "Alternatif" }] },
                { id: "sus4", name: "sus4", fullName: "Sus4", notes: [0, 5, 7, 10], scales: [{ id: "mixolydian", role: "Principal" }, { id: "minorPentatonic", role: "Alternatif" }, { id: "bluesScale", role: "Blues" }] },
                { id: "7sus4", name: "7sus4", fullName: "7sus4", notes: [0, 5, 7, 10], scales: [{ id: "mixolydian", role: "Principal" }, { id: "phrygianDominant", role: "Alternatif" }] },
                { id: "m7b5", name: "m7b5", fullName: "Mineur 7 b5", notes: [0, 3, 6, 10], scales: [{ id: "locrian", role: "Principal" }, { id: "wholeHalfDim", role: "Symétrique" }] }
            ]
        };

        const app = {
            selectedRootIndex: 0,
            currentCategory: 'maj',
            selectedChordId: 'maj7',
            visMode: 'staff',
            selectedInstrumentKey: 'Bb',
            showTargetNotes: false,
            showAvoidNotes: false,
            showCharacteristic: false,
            activeAudioNodes: [],
            activePlaybacks: {},
            scaleDirections: {},
            audioCtx: null,
            piano: null,
            reverbInput: null,
            isLoopMode: false,
            loopInterval: null,
            rootButtonsContainer: null,
            qualityButtonsContainer: null,
            scalesContainer: null,
            mount() {
                this.rootButtonsContainer = document.getElementById('root-buttons-container');
                this.qualityButtonsContainer = document.getElementById('quality-buttons-container');
                this.scalesContainer = document.getElementById('scales-container');

                this.renderRootButtons();
                this.renderQualityButtons();
                this.bindGlobalControls();
                this.updateChordDisplay();
                this.renderScales(this.getCurrentChordObj(), rootLabels[this.selectedRootIndex]);
                this.attachInitialAudio();
            },
            attachInitialAudio() {
                this.initAudioContext();
            },
            initAudioContext() {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                if (!this.audioCtx) this.audioCtx = new AudioCtx();
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume().catch(() => {});
            },
            getCurrentChordObj() {
                const chordList = chordTypes[this.currentCategory] || chordTypes.maj;
                return chordList.find(item => item.id === this.selectedChordId) || chordList[0];
            },
            updateChordDisplay() {
                const chord = this.getCurrentChordObj();
                const rootLabel = rootLabels[this.selectedRootIndex];
                document.getElementById('display-chord-name').textContent = `${rootLabel}${chord.name}`;
                document.getElementById('selected-root-badge').textContent = rootLabel;
                document.getElementById('selected-quality-badge').textContent = chord.name;
                document.getElementById('display-chord-notes').innerHTML = '';
                chord.notes.forEach((interval) => {
                    const note = this.getNoteName(interval, rootLabel);
                    const span = document.createElement('span');
                    span.className = 'tag tag-blue';
                    span.textContent = note;
                    document.getElementById('display-chord-notes').appendChild(span);
                });
            },
            getNoteName(interval, rootLabel) {
                const semitoneIndex = (this.selectedRootIndex + interval) % 12;
                const note = NOTE_NAMES_SHARP[semitoneIndex] || NOTE_NAMES_FLAT[semitoneIndex];
                return note;
            },
            renderRootButtons() {
                this.rootButtonsContainer.innerHTML = '';
                rootLabels.forEach((label, index) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = label;
                    btn.className = 'pill-button py-1.5 rounded-md transition ' + (index === this.selectedRootIndex ? 'active' : '');
                    btn.addEventListener('click', () => {
                        this.selectedRootIndex = index;
                        this.renderRootButtons();
                        this.updateChordDisplay();
                        this.renderScales(this.getCurrentChordObj(), rootLabels[this.selectedRootIndex]);
                    });
                    this.rootButtonsContainer.appendChild(btn);
                });
            },
            renderQualityButtons() {
                this.qualityButtonsContainer.innerHTML = '';
                const chordList = chordTypes[this.currentCategory] || chordTypes.maj;
                chordList.forEach((chord) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = chord.name;
                    btn.className = 'pill-button py-1.5 rounded-md transition ' + (chord.id === this.selectedChordId ? 'active' : '');
                    btn.addEventListener('click', () => {
                        this.selectedChordId = chord.id;
                        this.renderQualityButtons();
                        this.updateChordDisplay();
                        this.renderScales(this.getCurrentChordObj(), rootLabels[this.selectedRootIndex]);
                    });
                    this.qualityButtonsContainer.appendChild(btn);
                });
            },
            bindGlobalControls() {
                document.querySelectorAll('[data-key]').forEach((button) => {
                    button.addEventListener('click', () => {
                        this.selectedInstrumentKey = button.dataset.key;
                        document.getElementById('selected-transposition-badge').textContent = this.selectedInstrumentKey;
                        document.querySelectorAll('[data-key]').forEach((el) => el.classList.toggle('active', el.dataset.key === this.selectedInstrumentKey));
                    });
                });

                document.querySelectorAll('[data-cat]').forEach((button) => {
                    button.addEventListener('click', () => {
                        this.currentCategory = button.dataset.cat;
                        const list = chordTypes[this.currentCategory] || chordTypes.maj;
                        this.selectedChordId = list[0].id;
                        document.querySelectorAll('[data-cat]').forEach((el) => el.classList.toggle('active', el.dataset.cat === this.currentCategory));
                        this.renderQualityButtons();
                        this.updateChordDisplay();
                        this.renderScales(this.getCurrentChordObj(), rootLabels[this.selectedRootIndex]);
                    });
                });

                document.querySelectorAll('.mode-button').forEach((button) => {
                    button.addEventListener('click', () => {
                        this.visMode = button.dataset.mode;
                        document.querySelectorAll('.mode-button').forEach(el => el.classList.toggle('active', el.dataset.mode === this.visMode));
                        this.renderScales(this.getCurrentChordObj(), rootLabels[this.selectedRootIndex]);
                    });
                });

                document.getElementById('btn-toggle-target').addEventListener('click', () => {
                    this.showTargetNotes = !this.showTargetNotes;
                    this.renderScales(this.getCurrentChordObj(), rootLabels[this.selectedRootIndex]);
                    document.getElementById('btn-toggle-target').setAttribute('aria-pressed', String(this.showTargetNotes));
                });
                document.getElementById('btn-toggle-avoid').addEventListener('click', () => {
                    this.showAvoidNotes = !this.showAvoidNotes;
                    this.renderScales(this.getCurrentChordObj(), rootLabels[this.selectedRootIndex]);
                    document.getElementById('btn-toggle-avoid').setAttribute('aria-pressed', String(this.showAvoidNotes));
                });
                document.getElementById('btn-toggle-characteristic').addEventListener('click', () => {
                    this.showCharacteristic = !this.showCharacteristic;
                    this.renderScales(this.getCurrentChordObj(), rootLabels[this.selectedRootIndex]);
                    document.getElementById('btn-toggle-characteristic').setAttribute('aria-pressed', String(this.showCharacteristic));
                });

                document.getElementById('play-chord-btn').addEventListener('click', () => this.playChord());
                document.getElementById('play-arp-btn').addEventListener('click', () => this.playArpeggio());
                document.getElementById('loop-chord-btn').addEventListener('click', () => this.toggleLoopMode());
            },
            getAudioNoteName(rootIndex, interval, octave = 3) {
                const targetSemitone = (rootIndex + interval) % 12;
                const noteName = NOTE_NAMES_SHARP[targetSemitone] || NOTE_NAMES_FLAT[targetSemitone];
                return `${noteName}${octave}`;
            },
            async loadPiano() {
                if (this.piano) return this.piano;
                if (!window.Soundfont) return null;
                try {
                    this.piano = await Soundfont.instrument(this.audioCtx || new (window.AudioContext || window.webkitAudioContext)(), 'acoustic_grand_piano');
                    this.audioCtx = this.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                    return this.piano;
                } catch (error) {
                    console.error('Piano unavailable:', error);
                    return null;
                }
            },
            playSingleNote(interval) {
                const note = this.getAudioNoteName(this.selectedRootIndex, interval, 3);
                this.playTone(note, 0.5);
            },
            playTone(note, duration = 0.5) {
                if (!this.audioCtx) this.initAudioContext();
                if (!this.audioCtx) return;
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume().catch(() => {});
                if (!this.piano) return;
                const node = this.piano.play(note, this.audioCtx.currentTime, { duration, destination: this.reverbInput || undefined });
                if (node) this.activeAudioNodes.push(node);
            },
            playChord() {
                const chord = this.getCurrentChordObj();
                chord.notes.forEach((interval, index) => {
                    setTimeout(() => this.playTone(this.getAudioNoteName(this.selectedRootIndex, interval, 3), 0.8), index * 110);
                });
            },
            playArpeggio() {
                const chord = this.getCurrentChordObj();
                chord.notes.forEach((interval, index) => {
                    setTimeout(() => this.playTone(this.getAudioNoteName(this.selectedRootIndex, interval, 3), 0.5), index * 150);
                });
            },
            toggleLoopMode() {
                this.isLoopMode = !this.isLoopMode;
                const btn = document.getElementById('loop-chord-btn');
                btn.classList.toggle('active', this.isLoopMode);
                if (this.isLoopMode) {
                    this.loopInterval = setInterval(() => this.playChord(), 700);
                } else if (this.loopInterval) {
                    clearInterval(this.loopInterval);
                    this.loopInterval = null;
                }
            },
            renderScales(chord, rootLabel) {
                const container = document.getElementById('scales-container');
                container.innerHTML = '';

                const compatibleScales = this.getCompatibleScales(chord);
                document.getElementById('scales-count-badge').textContent = `${compatibleScales.length} gammes`;

                compatibleScales.forEach((scale) => {
                    const card = document.createElement('article');
                    card.className = 'scale-card';
                    card.dataset.scaleKey = `${rootLabel}-${scale.id}`;
                    card.dataset.scaleIntervals = JSON.stringify(scale.intervals);

                    const header = document.createElement('div');
                    header.className = 'scale-header';
                    const left = document.createElement('div');
                    left.innerHTML = `<div class="text-sm font-semibold text-white">${scale.name}</div><div class="text-[11px] text-slate-400">${scale.category}</div>`;
                    const badge = document.createElement('span');
                    badge.className = 'scale-badge';
                    badge.textContent = scale.category;
                    header.appendChild(left);
                    header.appendChild(badge);

                    const body = document.createElement('div');
                    body.className = 'scale-body';

                    const noteWrap = document.createElement('div');
                    noteWrap.className = 'note-badges';
                    const notes = this.getScaleNotesForRoot(rootLabel, scale.intervals);
                    notes.forEach((note) => {
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.className = 'note-badge';
                        button.textContent = note;
                        button.dataset.interval = this.getIntervalFromNote(rootLabel, note);
                        if (this.showAvoidNotes && this.isAvoidNote(note, scale)) button.classList.add('avoid');
                        if (this.showTargetNotes && this.isTargetNote(note, chord)) button.classList.add('target');
                        if (this.showCharacteristic && this.isCharacteristicNote(note, scale)) button.classList.add('char');
                        button.addEventListener('click', () => this.playSingleNote(Number(button.dataset.interval)));
                        noteWrap.appendChild(button);
                    });

                    const visual = document.createElement('div');
                    visual.className = 'staff-visual';
                    visual.tabIndex = 0;
                    visual.setAttribute('role', 'button');
                    visual.setAttribute('aria-label', `Jouer la gamme ${scale.name}`);
                    visual.dataset.scaleKey = `${rootLabel}-${scale.id}`;
                    const lines = document.createElement('div');
                    lines.className = 'staff-lines';
                    for (let i = 0; i < 5; i++) lines.appendChild(document.createElement('span'));
                    visual.appendChild(lines);

                    const generatedNotes = this.getScaleVisualNotes(rootLabel, scale.intervals);
                    generatedNotes.forEach((note) => {
                        const dot = document.createElement('span');
                        dot.className = 'staff-note';
                        if (this.showAvoidNotes && this.isAvoidNote(note, scale)) dot.classList.add('avoid');
                        if (this.showCharacteristic && this.isCharacteristicNote(note, scale)) dot.classList.add('char');
                        dot.style.left = `${note.x}%`;
                        dot.style.top = `${note.y}%`;
                        visual.appendChild(dot);
                    });

                    visual.addEventListener('click', () => {
                        this.toggleScalePlayback(`${rootLabel}-${scale.id}`, scale.intervals, scale.name, visual);
                    });

                    body.appendChild(noteWrap);
                    body.appendChild(visual);
                    if (this.showCharacteristic) {
                        const desc = document.createElement('div');
                        desc.className = 'text-[11px] text-slate-300 mt-2';
                        desc.textContent = scale.desc;
                        body.appendChild(desc);
                    }

                    card.appendChild(header);
                    card.appendChild(body);
                    container.appendChild(card);
                });
            },
            getCompatibleScales(chord) {
                const root = rootLabels[this.selectedRootIndex];
                return Object.entries(scaleDb)
                    .map(([id, scale]) => ({ id, ...scale, root, notes: this.getScaleNotesForRoot(root, scale.intervals) }))
                    .filter((scale) => this.scaleMatchesChord(scale, chord))
                    .sort((a, b) => a.name.localeCompare(b.name));
            },
            scaleMatchesChord(scale, chord) {
                const root = rootLabels[this.selectedRootIndex];
                const chordNotes = chord.notes.map((interval) => this.getNoteName(interval, root));
                const notes = this.getScaleNotesForRoot(root, scale.intervals);
                const matches = chordNotes.filter((note) => notes.includes(note)).length;
                return matches >= 2 || scale.id === 'ionian' || scale.id === 'dorian' || scale.id === 'mixolydian';
            },
            getScaleNotesForRoot(rootLabel, intervals) {
                const base = rootLabels.indexOf(rootLabel);
                return intervals.map((interval) => NOTE_NAMES_SHARP[(base + interval) % 12]);
            },
            getScaleVisualNotes(rootLabel, intervals) {
                const rootIndex = rootLabels.indexOf(rootLabel);
                return intervals.map((interval, idx) => {
                    const semitone = (rootIndex + interval) % 12;
                    const top = 25 + ((11 - semitone) * 4.6);
                    return { x: 12 + (idx * 13), y: Math.min(80, Math.max(20, top)) };
                });
            },
            isAvoidNote(note, scale) {
                return scale.id === 'phrygian' && note.includes('F');
            },
            isTargetNote(note, chord) {
                return chord.notes.some(interval => this.getNoteName(interval, rootLabels[this.selectedRootIndex]) === note);
            },
            isCharacteristicNote(note, scale) {
                return this.getScaleNotesForRoot(rootLabels[this.selectedRootIndex], [scale.characteristicInterval]).includes(note);
            },
            getIntervalFromNote(rootLabel, note) {
                const rootIndex = rootLabels.indexOf(rootLabel);
                const noteIndex = NOTE_NAMES_SHARP.indexOf(note);
                if (noteIndex === -1) return 0;
                return (noteIndex - rootIndex + 12) % 12;
            },
            toggleScalePlayback(scaleKey, intervals, scaleName, element) {
                if (typeof window.toggleScalePlayback === 'function') {
                    return window.toggleScalePlayback(scaleKey, intervals, scaleName, element);
                }
                if (typeof this._toggleScalePlayback === 'function') {
                    return this._toggleScalePlayback(scaleKey, intervals, scaleName, element);
                }
                const ordered = [...intervals, 12];
                const active = this.activePlaybacks[scaleKey];
                if (active) {
                    clearTimeout(active);
                    delete this.activePlaybacks[scaleKey];
                    return;
                }
                const timer = setTimeout(() => {
                    ordered.forEach((interval, index) => {
                        setTimeout(() => this.playSingleNote(interval), index * 250);
                    });
                    this.activePlaybacks[scaleKey] = setTimeout(() => {
                        delete this.activePlaybacks[scaleKey];
                    }, ordered.length * 300 + 250);
                }, 0);
                this.activePlaybacks[scaleKey] = timer;
            }
        };

        window.app = app;
        app.mount();
    </script>
    <script src="./enhancements.js"></script>
</body>
</html>

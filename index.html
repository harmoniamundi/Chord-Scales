<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chord Scales Machine</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss-cdn@3.4.10/tailwindcss.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --panel-2: #222222;
            --panel-3: #252525;
            --border: #333333;
            --muted: #94a3b8;
            --text: #f8fafc;
            --blue: #2563eb;
            --blue-soft: rgba(37, 99, 235, 0.2);
            --rose-soft: rgba(244, 63, 94, 0.18);
            --amber-soft: rgba(245, 158, 11, 0.18);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: var(--bg);
        }

        button {
            font: inherit;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--panel);
        }

        .titlebar {
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            border-bottom: 1px solid var(--border);
            background: #282828;
        }

        .content-shell {
            display: flex;
            flex: 1;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }

        .sidebar {
            width: 380px;
            flex: 0 0 380px;
            background: var(--panel-2);
            border-right: 1px solid var(--border);
            padding: 1rem;
            overflow-y: auto;
        }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            background: var(--panel);
        }

        .panel-card {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 16px;
            padding: 1rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .muted-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #7dd3fc;
            font-weight: 700;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #cbd5e1;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 0.2rem 0.5rem;
            font-size: 10px;
            font-weight: 700;
            line-height: 1.4;
        }

        .tag-blue { background: rgba(37,99,235,0.18); color: #bfdbfe; }
        .tag-purple { background: rgba(168,85,247,0.18); color: #e9d5ff; }
        .tag-rose { background: rgba(244,63,94,0.18); color: #fecdd3; }
        .tag-amber { background: rgba(245,158,11,0.18); color: #fde68a; }

        .chip {
            border: 1px solid var(--border);
            border-radius: 0.7rem;
            background: rgba(255,255,255,0.02);
            color: #e2e8f0;
            transition: 160ms ease;
        }

        .chip:hover {
            background: rgba(255,255,255,0.04);
        }

        .chip-active {
            background: rgba(58, 89, 180, 0.22);
            color: white;
            border-color: rgba(59,130,246,0.8);
            box-shadow: 0 1px 0 rgba(255,255,255,0.04);
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 0.6rem;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.02);
            color: #e2e8f0;
            transition: 160ms ease;
            cursor: pointer;
        }

        .btn-icon:hover {
            background: rgba(255,255,255,0.06);
        }

        .btn-icon.active {
            background: rgba(37,99,235,0.75);
            border-color: rgba(96,165,250,0.9);
            color: white;
        }

        .root-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 0.375rem;
        }

        .quality-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.375rem;
        }

        .pill-button {
            border: 1px solid var(--border);
            border-radius: 0.7rem;
            background: rgba(255,255,255,0.02);
            color: #cbd5e1;
            transition: 140ms ease;
            cursor: pointer;
        }

        .pill-button:hover {
            color: white;
        }

        .pill-button.active {
            background: rgba(37,99,235,0.25);
            color: white;
            border-color: rgba(96,165,250,0.85);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: #252525;
        }

        .toggle-btn {
            appearance: none;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: #cbd5e1;
            border-radius: 0.55rem;
            padding: 0.15rem 0.5rem;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 120ms ease;
        }

        .toggle-btn[aria-pressed="true"] {
            border-color: rgba(96,165,250,0.7);
            color: #dbeafe;
            background: rgba(59,130,246,0.18);
        }

        .mode-group {
            display: inline-flex;
            gap: 0.25rem;
            padding: 0.2rem;
            border-radius: 0.8rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
        }

        .mode-button {
            border: 0;
            border-radius: 0.55rem;
            background: transparent;
            color: #cbd5e1;
            padding: 0.35rem 0.7rem;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 120ms ease;
        }

        .mode-button.active {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        #scales-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem;
            padding: 1.25rem;
            overflow-y: auto;
            min-height: 0;
        }

        .scale-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .scale-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .scale-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 0.2rem 0.45rem;
            font-size: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: #cbd5e1;
        }

        .scale-body {
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
        }

        .note-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        .note-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.25rem;
            padding: 0.35rem 0.45rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(15,23,42,0.42);
            color: #e2e8f0;
            font-size: 11px;
            font-weight: 700;
            font-family: "SF Mono", Menlo, monospace;
            cursor: pointer;
            transition: 120ms ease;
        }

        .note-badge:hover {
            background: rgba(37,99,235,0.2);
        }

        .note-badge.avoid {
            background: rgba(244,63,94,0.18);
            border-color: rgba(244,63,94,0.42);
            color: #fecdd3;
        }

        .note-badge.char { background: rgba(245,158,11,0.18); border-color: rgba(245,158,11,0.42); color: #fde68a; }
        .note-badge.target { background: rgba(37,99,235,0.25); border-color: rgba(96,165,250,0.8); color: white; }

        .staff-visual {
            position: relative;
            border-radius: 0.8rem;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.97);
            height: 140px;
            overflow: hidden;
            cursor: pointer;
        }

        .staff-lines {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: none;
        }

        .staff-lines span {
            display: block;
            height: 1px;
            background: rgba(15, 23, 42, 0.6);
            margin: 0 0.75rem;
        }

        .staff-note {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2563eb;
            box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
            transform: translate(-50%, -50%);
        }

        .staff-note.avoid {
            background: #ef4444;
            box-shadow: 0 0 0 2px rgba(239,68,68,0.2);
        }

        .staff-note.char {
            background: #f59e0b;
            box-shadow: 0 0 0 2px rgba(245,158,11,0.2);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body class="bg-[#121212] text-slate-100 selection:bg-blue-500 selection:text-white">
    <div class="app-shell">
        <header class="titlebar">
            <div class="flex items-center space-x-2">
                <span class="text-xs font-semibold text-slate-300">Chord Scales Machine</span>
            </div>
        </header>

        <div class="content-shell">
            <aside class="sidebar custom-scrollbar">
                <div class="panel-card">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="muted-label">Accord actuel</span>
                            <div id="display-chord-name" class="text-2xl font-bold tracking-tight text-white mt-0.5">Cmaj7</div>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button id="play-chord-btn" type="button" class="btn-icon" aria-label="Jouer l'accord" title="Jouer l'accord">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                            <button id="play-arp-btn" type="button" class="btn-icon" aria-label="Jouer l'arpège" title="Jouer l'arpège">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5v14M5 12h14"/></svg>
                            </button>
                            <button id="loop-chord-btn" type="button" class="btn-icon" aria-label="Activer la boucle" title="Activer la boucle">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A7 7 0 0 0 10 4H4m16 16v-5h-.582m-15.356-2A7 7 0 0 0 14 20h6"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="mt-3 pt-2.5 border-t border-[#3a3a3c]">
                        <span class="text-[10px] text-slate-400 block mb-1">Notes :</span>
                        <div id="display-chord-notes" class="flex flex-wrap gap-1" aria-live="polite"></div>
                    </div>
                </div>

                <div class="space-y-2 mt-5">
                    <div class="flex justify-between items-center px-1">
                        <span class="section-label">Tonalité instrumentale</span>
                        <span id="selected-transposition-badge" class="tag tag-purple">Bb</span>
                    </div>
                    <div class="flex bg-[#1a1a1a] p-1 rounded-lg text-xs font-medium border border-[#333333]">
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition active" data-key="Bb">Bb</button>
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition" data-key="C">C</button>
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition" data-key="Eb">Eb</button>
                    </div>
                </div>

                <div class="space-y-2 mt-5">
                    <div class="flex justify-between items-center px-1">
                        <span class="section-label">1. Fondamentale</span>
                        <span id="selected-root-badge" class="tag tag-blue">C</span>
                    </div>
                    <div id="root-buttons-container" class="root-grid"></div>
                </div>

                <div class="space-y-2 mt-5">
                    <div class="flex justify-between items-center px-1">
                        <span class="section-label">2. Qualité</span>
                        <span id="selected-quality-badge" class="tag tag-purple">maj7</span>
                    </div>
                    <div class="flex bg-[#1a1a1a] p-1 rounded-lg text-xs font-medium border border-[#333333]">
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition active" data-cat="maj">Maj</button>
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition" data-cat="min">Min</button>
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition" data-cat="dom">Dom</button>
                        <button type="button" class="pill-button flex-1 py-1 rounded-md transition" data-cat="other">Autre</button>
                    </div>
                    <div id="quality-buttons-container" class="quality-grid pt-1"></div>
                </div>
            </aside>

            <main class="main-panel">
                <div class="toolbar">
                    <div class="flex items-center gap-2 flex-wrap">
                        <h2 class="text-sm font-bold text-white">Gammes compatibles</h2>
                        <span id="scales-count-badge" class="tag tag-blue">0 gammes</span>
                        <button id="btn-toggle-target" type="button" class="toggle-btn" aria-pressed="false">Notes ciblées</button>
                        <button id="btn-toggle-avoid" type="button" class="toggle-btn" aria-pressed="false">Notes à éviter</button>
                        <button id="btn-toggle-characteristic" type="button" class="toggle-btn" aria-pressed="false">Note caractéristique</button>
                    </div>

                    <div class="ml-auto">
                        <div class="mode-group">
                            <button type="button" class="mode-button active" data-mode="staff">Portée</button>
                            <button type="button" class="mode-button" data-mode="intervals">Intervalles</button>
                            <button type="button" class="mode-button" data-mode="notes">Notes</button>
                            <button type="button" class="mode-button" data-mode="letters">Lettres</button>
                        </div>
                    </div>
                </div>

                <div id="scales-container" class="custom-scrollbar" aria-live="polite"></div>
            </main>
        </div>
    </div>

    <script>
        const rootLabels = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
        const NOTE_NAMES_SHARP = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const NOTE_NAMES_FLAT = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
        const NATURAL_SEMITONES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

        const scaleDb = {
            ionian: { name: "Ionien (Gamme majeure)", category: "Diatonique", intervals: [0, 2, 4, 5, 7, 9, 11], characteristicInterval: 11, desc: "Utilisé sur le degré I. La quarte frotte avec la tierce majeure et la dominante en jazz moderne." },
            lydian: { name: "Lydien", category: "Diatonique / Majeur", intervals: [0, 2, 4, 6, 7, 9, 11], characteristicInterval: 6, desc: "Choix principal en jazz moderne pour éviter la quarte juste dissonante." },
            lydianAug: { name: "Lydien Augmenté", category: "Mineur Mélodique", intervals: [0, 2, 4, 6, 8, 9, 11], characteristicInterval: 8, desc: "Sur Maj7#5 (degré III du mineur mélodique)." },
            harmonicMajor: { name: "Majeur Harmonique", category: "Emprunt Modal", intervals: [0, 2, 4, 5, 7, 8, 11], characteristicInterval: 8, desc: "Sert aux emprunts modaux pour apporter une couleur sombre." },
            majorBebop: { name: "Gamme Bebop Majeure", category: "Bebop", intervals: [0, 2, 4, 5, 7, 8, 9, 11], characteristicInterval: 8, desc: "Ajoute un chromatisme entre la quinte et la septième majeure." },
            majorPentatonic: { name: "Pentatonique Majeure", category: "Pentatonique", intervals: [0, 2, 4, 7, 9], characteristicInterval: 9, desc: "Retire les demi-tons pour une sonorité ouverte et consonante." },
            majorBlues: { name: "Gamme Blues Majeure", category: "Blues", intervals: [0, 2, 3, 4, 7, 9], characteristicInterval: 3, desc: "Introduit la tierce mineure comme approche chromatique." },
            dorian: { name: "Dorien", category: "Diatonique / Mineur", intervals: [0, 2, 3, 5, 7, 9, 10], characteristicInterval: 9, desc: "Degré II. La sixte majeure stabilise l'accord." },
            melodicMinor: { name: "Mineur Mélodique", category: "Mineur Mélodique", intervals: [0, 2, 3, 5, 7, 9, 11], characteristicInterval: 11, desc: "Sur mMaj7 ou m6. Accord de tonique mineure de référence." },
            aeolian: { name: "Éolien (Mineur naturel)", category: "Diatonique / Mineur", intervals: [0, 2, 3, 5, 7, 8, 10], characteristicInterval: 8, desc: "Degré VI. La b6 frotte contre la quinte et la dominante." },
            phrygian: { name: "Phrygien", category: "Diatonique / Mineur", intervals: [0, 1, 3, 5, 7, 8, 10], characteristicInterval: 1, desc: "Degré III. Très dissonant." },
            harmonicMinor: { name: "Mineur Harmonique", category: "Mineur Harmonique", intervals: [0, 2, 3, 5, 7, 8, 11], characteristicInterval: 11, desc: "Sur mMaj7 avec une couleur classique marquée." },
            minorBebop: { name: "Bebop Mineure (Dorienne)", category: "Bebop", intervals: [0, 2, 3, 5, 7, 9, 10, 11], characteristicInterval: 11, desc: "Ajoute la septième majeure comme chromatisme de passage." },
            minorPentatonic: { name: "Pentatonique Mineure", category: "Pentatonique", intervals: [0, 3, 5, 7, 10], characteristicInterval: 3, desc: "Choix standard, élimine les risques de frottement." },
            bluesScale: { name: "Gamme Blues", category: "Pentatonique / Blues", intervals: [0, 3, 5, 6, 7, 10], characteristicInterval: 6, desc: "L'ajout de la blue note crée de la tension sans changer la nature mineure." },
            mixolydian: { name: "Mixolydien", category: "Diatonique / Dominant", intervals: [0, 2, 4, 5, 7, 9, 10], characteristicInterval: 10, desc: "Sur un V7 classique non altéré." },
            lydianDominant: { name: "Lydien Dominant (Lydien b7)", category: "Mineur Mélodique", intervals: [0, 2, 4, 6, 7, 9, 10], characteristicInterval: 6, desc: "Pour les V7 qui ne résolvent pas en quinte juste." },
            altered: { name: "Altéré (Super Locrien)", category: "Mineur Mélodique", intervals: [0, 1, 3, 4, 6, 8, 10], characteristicInterval: 1, desc: "Pour V7 résolvant sur un I. Contient toutes les altérations de la dominante." },
            mixolydianFlat13: { name: "Mixolydien b13", category: "Mineur Mélodique", intervals: [0, 2, 4, 5, 7, 8, 10], characteristicInterval: 8, desc: "5e mode du mineur mélodique." },
            phrygianDominant: { name: "Phrygien Dominant", category: "Mineur Harmonique", intervals: [0, 1, 4, 5, 7, 8, 10], characteristicInterval: 1, desc: "Pour V7 vers un accord mineur." },
            mixolydianFlat9: { name: "Mixolydien b9", category: "Majeur Harmonique", intervals: [0, 1, 4, 5, 7, 9, 10], characteristicInterval: 1, desc: "5e mode du majeur harmonique." },
            dominantBebop: { name: "Bebop Dominante", category: "Bebop", intervals: [0, 2, 4, 5, 7, 9, 10, 11], characteristicInterval: 11, desc: "Chromatisme entre la septième mineure et la fondamentale." },
            halfWholeDim: { name: "Demi-Ton / Ton (Octatonique)", category: "Symétrique", intervals: [0, 1, 3, 4, 6, 7, 9, 10], characteristicInterval: 1, desc: "Sur accords 7b9 ou 7#9, garde la quinte juste et la tension." },
            wholeTone: { name: "Par Tons (Hexatonique)", category: "Symétrique", intervals: [0, 2, 4, 6, 8, 10], characteristicInterval: 6, desc: "Sur les accords 7#5, sans 9ème altérée." },
            locrianSharp2: { name: "Locrien bécarre 2", category: "Mineur Mélodique", intervals: [0, 2, 3, 5, 6, 8, 10], characteristicInterval: 2, desc: "Choix moderne par défaut sur le degré II d'un mineur mélodique." },
            locrian: { name: "Locrien", category: "Diatonique", intervals: [0, 1, 3, 5, 6, 8, 10], characteristicInterval: 1, desc: "Degré VII de la gamme majeure." },
            minorPentatonicFlat5: { name: "Pentatonique mineure b5", category: "Pentatonique", intervals: [0, 3, 5, 6, 10], characteristicInterval: 6, desc: "Version allégée du Locrien." },
            wholeHalfDim: { name: "Ton / Demi-Ton (Octatonique)", category: "Symétrique", intervals: [0, 2, 3, 5, 6, 8, 9, 11], characteristicInterval: 9, desc: "Option principale, couvre la structure symétrique d'un accord diminué." }
        };

        const chordTypes = {
            maj: [
                { id: "maj7", name: "maj7", fullName: "Majeur 7", notes: [0, 4, 7, 11], scales: [{ id: "lydian", role: "Principal (Moderne)" }, { id: "ionian", role: "Degré I" }, { id: "harmonicMajor", role: "Emprunt modal" }, { id: "majorBebop", role: "Rythme Bebop" }, { id: "majorPentatonic", role: "Consonance ouverte" }] },
                { id: "maj9", name: "maj9", fullName: "Majeur 9", notes: [0, 4, 7, 11, 2], scales: [{ id: "lydian", role: "Principal" }, { id: "ionian", role: "Degré I" }] },
                { id: "6", name: "6", fullName: "Sixte", notes: [0, 4, 7, 9], scales: [{ id: "ionian", role: "Principal" }, { id: "lydian", role: "Moderne" }, { id: "majorBebop", role: "Bebop" }, { id: "majorPentatonic", role: "Consonance" }] },

                { id: "7sharp5", name: "7(#5)", fullName: "Dominante 7 quinte augmentée", notes: [0, 4, 8, 10], scales: [{ id: "wholeTone", role: "Principal (Ton par ton)" }, { id: "altered", role: "Altéré" }] }

                { id: "dim7", name: "dim7", fullName: "Diminué 7", notes: [0, 3, 6, 9], scales: [{ id: "wholeHalfDim", role: "Principal (Couvre la structure symétrique)" }] },
                { id: "7sus4", name: "7sus4", fullName: "Dominante Suspendue", notes: [0, 5, 7, 10], scales: [{ id: "mixolydian", role: "Principal" }, { id: "dorian", role: "Aérien" }, { id: "phrygian", role: "Modal / Sus4 b9" }] }
            ]
        };

        function getSemiFromNoteName(noteName) {
            const sharpIndex = NOTE_NAMES_SHARP.indexOf(noteName);
            if (sharpIndex !== -1) return sharpIndex;
            const flatIndex = NOTE_NAMES_FLAT.indexOf(noteName);
            return flatIndex !== -1 ? flatIndex : 0;
        }

        function getAccidentalFromDiff(diff) {
            const map = { 2: '##', 1: '#', 0: '', '-1': 'b', '-2': 'bb' };
            return map[diff] ?? '';
        }

        function getStrictSpelledNotes(rootName, intervals) {
            const baseLetters = { ...majorScalesSpelling, C: ["C", "D", "E", "F", "G", "A", "B"] };
            const notes = [];
            const rootSemi = getSemiFromNoteName(rootName);

            intervals.forEach((interval, idx) => {
                const targetSemi = (rootSemi + interval) % 12;
                const baseNote = (baseLetters[rootName] || ["C", "D", "E", "F", "G", "A", "B"])[idx] || "C";
                const baseLetter = baseNote[0];
                const naturalSemi = NATURAL_SEMITONES[baseLetter] ?? 0;
                let diff = targetSemi - naturalSemi;
                if (diff > 6) diff -= 12;
                if (diff < -6) diff += 12;
                const accidental = getAccidentalFromDiff(diff);

                const useFlats = rootName.includes('b') || ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'].includes(rootName);
                if (useFlats) {
                    const flatPreferred = { 1: 'Db', 3: 'Eb', 6: 'Gb', 8: 'Ab', 10: 'Bb' };
                    if (flatPreferred[targetSemi] && flatPreferred[targetSemi][0] === baseLetter) {
                        notes.push(flatPreferred[targetSemi]);
                        return;
                    }
                }

                notes.push(baseLetter + accidental);
            });

            return notes;
        }

        const majorScalesSpelling = {
            C: ["C", "D", "E", "F", "G", "A", "B"],
            Db: ["Db", "Eb", "F", "Gb", "Ab", "Bb", "C"],
            D: ["D", "E", "F#", "G", "A", "B", "C#"],
            Eb: ["Eb", "F", "G", "Ab", "Bb", "C", "D"],
            E: ["E", "F#", "G#", "A", "B", "C#", "D#"],
            F: ["F", "G", "A", "Bb", "C", "D", "E"],
            "F#": ["F#", "G#", "A#", "B", "C#", "D#", "E#"],
            Gb: ["Gb", "Ab", "Bb", "Cb", "Db", "Eb", "F"],
            G: ["G", "A", "B", "C", "D", "E", "F#"],
            Ab: ["Ab", "Bb", "C", "Db", "Eb", "F", "G"],
            A: ["A", "B", "C#", "D", "E", "F#", "G#"],
            Bb: ["Bb", "C", "D", "Eb", "F", "G", "A"],
            B: ["B", "C#", "D#", "E", "F#", "G#", "A#"]
        };

        function getSpelledChordNotes(rootName, chordObj) {
            const baseLetters = majorScalesSpelling[rootName] || majorScalesSpelling.C;
            const rootSemi = getSemiFromNoteName(rootName);
            const notes = [];

            chordObj.notes.forEach((interval, idx) => {
                const targetSemi = (rootSemi + interval) % 12;
                const baseLetter = baseLetters[Math.min(idx, baseLetters.length - 1)][0];
                const naturalSemi = NATURAL_SEMITONES[baseLetter] ?? 0;
                let diff = targetSemi - naturalSemi;
                if (diff > 6) diff -= 12;
                if (diff < -6) diff += 12;

                const accidental = getAccidentalFromDiff(diff);
                const useFlats = rootName.includes('b') || ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'].includes(rootName);
                if (useFlats) {
                    const flatPreferred = { 1: 'Db', 3: 'Eb', 6: 'Gb', 8: 'Ab', 10: 'Bb' };
                    if (flatPreferred[targetSemi] && flatPreferred[targetSemi][0] === baseLetter) {
                        notes.push(flatPreferred[targetSemi]);
                        return;
                    }
                }
                notes.push(baseLetter + accidental);
            });

            return notes;
        }

        function getIntervalLabel(interval, chordNotes) {
            const has = (n) => chordNotes.includes(n);
            const inChord = has(interval);
            const hasMajThird = has(4);
            const hasMinThird = has(3);
            const hasThird = hasMajThird || hasMinThird;

            switch (interval) {
                case 0: return "1";
                case 1: return "b9";
                case 2: return "9";
                case 3: return inChord ? "b3" : (hasMajThird && has(10) ? "#9" : "b3");
                case 4: return "3";
                case 5: return (inChord && !hasThird) ? "4" : "11";
                case 6: return inChord ? (has(7) ? "#11" : "b5") : (hasMinThird ? "b5" : "#11");
                case 7: return "5";
                case 8: return inChord ? "#5" : "b13";
                case 9: return inChord ? ((hasMinThird && has(6)) ? "bb7" : "6") : "13";
                case 10: return "b7";
                case 11: return "7";
                case 12: return "8";
                default: return String(interval);
            }
        }

        function getAvoidNotes(scaleId, chordId) {
            const avoids = [];
            const isDom = ['7', '9', '7alt', '7b9', '7sharp5'].includes(chordId);

            if (['ionian', 'majorBebop'].includes(scaleId)) avoids.push(5);
            if (['mixolydian', 'mixolydianFlat13', 'phrygianDominant', 'mixolydianFlat9', 'dominantBebop'].includes(scaleId) && chordId !== '7sus4') avoids.push(5);
            if (['aeolian', 'harmonicMinor'].includes(scaleId)) avoids.push(8);
            if (scaleId === 'phrygian') { avoids.push(1); avoids.push(8); }
            if (scaleId === 'locrian') avoids.push(1);
            if (scaleId === 'bluesScale' && isDom) avoids.push(3);
            return avoids;
        }

        class ChordScaleApp {
            constructor() {
                this.selectedRootIndex = 0;
                this.currentCategory = 'maj';

            toggleShowTargetNotes() {

            setInstrumentKey(key) {
                this.instrumentKey = key;
                const badge = document.getElementById('selected-transposition-badge');

                });

            getAudioNoteName(rootIndex, interval, baseOctave = 3) {
                const offsets = { C: 0, Bb: -2, Eb: -9 };
                const offset = offsets[this.instrumentKey] || 0;
                const absSemis = rootIndex + interval + offset;
                const normalizedSemi = ((absSemis % 12) + 12) % 12;
                const octaveOffset = Math.floor(absSemis / 12);
                const octave = baseOctave + octaveOffset;
                const rootName = rootLabels[normalizedSemi];
                return `${rootName}${octave}`;
            }

            initAudioContextOnInteraction() {
                const triggerInit = async () => {
                    if (!this.pianoInstrument) {
                        await this.loadPiano();
                    }
                    window.removeEventListener('click', triggerInit);
                    window.removeEventListener('keydown', triggerInit);
                };
                window.addEventListener('click', triggerInit);
                window.addEventListener('keydown', triggerInit);
            }

            async loadPiano() {
                if (this.pianoInstrument) return this.pianoInstrument;
                if (this.pianoLoading) return this.pianoLoading;

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!this.audioCtx) {
                    this.audioCtx = new AudioContext();
                }

                if (this.audioCtx.state === 'suspended') {
                    await this.audioCtx.resume().catch(() => {});
                }

                this.reverbInput = this.setupReverb(this.audioCtx);

                this.pianoLoading = Soundfont.instrument(this.audioCtx, 'acoustic_grand_piano', { soundfont: 'FluidR3_GM' })
                    .then((instr) => {
                        this.pianoInstrument = instr;
                        this.pianoLoading = null;
                        return instr;
                    })
                    .catch((err) => {
                        console.error('Erreur chargement piano:', err);
                        this.pianoLoading = null;
                        return null;
                    });

                return this.pianoLoading;
            }

            setupReverb(audioCtx) {
                const convolver = audioCtx.createConvolver();
                const rate = audioCtx.sampleRate;
                const length = rate * 2.2;
                const impulse = audioCtx.createBuffer(2, length, rate);
                const left = impulse.getChannelData(0);
                const right = impulse.getChannelData(1);

                for (let i = 0; i < length; i++) {
                    const decay = Math.exp(-i / (rate * 0.6));
                    left[i] = (Math.random() * 2 - 1) * decay;
                    right[i] = (Math.random() * 2 - 1) * decay;
                }

                convolver.buffer = impulse;
                const wetGain = audioCtx.createGain();
                wetGain.gain.value = 0.18;
                const dryGain = audioCtx.createGain();
                dryGain.gain.value = 0.85;
                const masterGain = audioCtx.createGain();
                masterGain.gain.value = 1.1;

                const inputNode = audioCtx.createGain();
                inputNode.connect(dryGain);
                inputNode.connect(convolver);
                convolver.connect(wetGain);
                dryGain.connect(masterGain);
                wetGain.connect(masterGain);
                masterGain.connect(audioCtx.destination);

                return inputNode;
            }

            renderRootButtons() {
                const container = document.getElementById('root-buttons-container');

                    container.appendChild(btn);

            setQualityCategory(cat) {

            renderQualityButtons() {
                const container = document.getElementById('quality-buttons-container');

                const qualities = chordTypes[this.currentCategory] || [];

            setVisMode(mode) {
                this.visMode = mode;

                    btn.classList.toggle('active', btn.dataset.mode === mode);
                });

            getCurrentChordObj() {
                if (this.selectedChordId) {
                    for (const category of Object.keys(chordTypes)) {
                        const match = chordTypes[category].find(q => q.id === this.selectedChordId);
                        if (match) return match;
                    }
                }
                return chordTypes[this.currentCategory]?.[0] || chordTypes.maj[0];
            }

            update() {
                const rootName = rootLabels[this.selectedRootIndex];
                const chordObj = this.getCurrentChordObj();
                const chordNameFull = `${rootName}${chordObj.name}`;

                const rootBadge = document.getElementById('selected-root-badge');
                if (rootBadge) rootBadge.textContent = rootName;

                const qualityBadge = document.getElementById('selected-quality-badge');
                if (qualityBadge) qualityBadge.textContent = this.selectedChordId ? chordObj.name : '-';

                const displayName = document.getElementById('display-chord-name');
                if (displayName) displayName.textContent = chordNameFull;

                const chordNotesContainer = document.getElementById('display-chord-notes');
                if (chordNotesContainer) {
                    chordNotesContainer.innerHTML = '';
                    const chordSpelled = getSpelledChordNotes(rootName, chordObj);
                    chordSpelled.forEach((note, idx) => {
                        const interval = chordObj.notes[idx];
                        const badge = document.createElement('span');
                        badge.className = 'px-2 py-0.5 bg-[#2563eb] text-white rounded font-mono font-bold cursor-pointer hover:bg-blue-600 transition shadow-sm';
                        badge.textContent = note;
                        badge.type = 'button';
                        badge.title = `Jouer la note ${note}`;
                        badge.addEventListener('click', (event) => {
                            event.stopPropagation();
                            this.playSingleNote(interval);
                        });
                        chordNotesContainer.appendChild(badge);
                    });

                this.renderScales(chordObj, rootName);
            }

            renderScales(chordObj, rootName) {
                const container = document.getElementById('scales-container');
                if (!container) return;
                container.innerHTML = '';

                const scalesList = chordObj.scales || [];
                const countBadge = document.getElementById('scales-count-badge');
                if (countBadge) countBadge.textContent = `${scalesList.length} gamme${scalesList.length > 1 ? 's' : ''}`;

                scalesList.forEach((item, index) => {
                    const scaleDef = scaleDb[item.id];
                    if (!scaleDef) return;

                    const scaleKey = `${item.id}-${index}`;
                    const isDesc = !!this.scaleDirections[scaleKey];
                    const avoidNotes = this.showAvoidNotes ? getAvoidNotes(item.id, chordObj.id) : [];
                    const characteristicInterval = this.showCharacteristic ? scaleDef.characteristicInterval : null;

                    const card = document.createElement('article');
                    card.className = 'scale-card';

                    const displayHtml = this.renderScaleVisualization({
                        scaleDef,
                        rootName,
                        chordObj,
                        scaleKey,
                        avoidNotes,
                        characteristicInterval,
                        isDesc
                    });

                    card.innerHTML = `
                        <div class="scale-header">
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="font-bold text-sm text-white">${rootName} ${scaleDef.name}</h3>
                                    <span class="scale-badge">${scaleDef.category}</span>
                                </div>
                                <div class="flex items-center gap-2 mt-0.5">
                                    <span class="text-xs font-medium text-blue-400">${item.role}</span>
                                    <span class="text-[10px] text-slate-500">• ${isDesc ? 'Descendant' : 'Ascendant'}</span>
                                </div>
                            </div>
                            <button type="button" class="toggle-btn scale-direction-button" data-scale-key="${scaleKey}" aria-label="Inverser le sens">↕</button>
                        </div>
                        <p class="text-xs text-slate-400">${scaleDef.desc}</p>
                        <div class="scale-body">
                            ${displayHtml}
                        </div>
                    `;

                    card.querySelector('.scale-direction-button')?.addEventListener('click', (event) => {
                        event.stopPropagation();
                        this.toggleScaleDirection(scaleKey);
                    });

                    container.appendChild(card);
                });
            }

            renderScaleVisualization({ scaleDef, rootName, chordObj, scaleKey, avoidNotes, characteristicInterval, isDesc }) {
                const intervals = [...scaleDef.intervals];
                const spelledNotes = getStrictSpelledNotes(rootName, intervals);

                if (this.visMode === 'staff') {
                    const notePositions = [];
                    const lineCount = 5;
                    const fullWidth = 100;
                    const marginLeft = 8;
                    const marginRight = 8;
                    const usableWidth = fullWidth - marginLeft - marginRight;

                    intervals.forEach((interval, idx) => {
                        const x = marginLeft + (idx / Math.max(intervals.length - 1, 1)) * usableWidth;
                        const y = 55 + ((interval % 2 === 0 ? 40 : 10) - (interval * 0.7)) * 0.4;
                        const isAvoid = avoidNotes.includes(interval);
                        const isChar = characteristicInterval === interval;
                        const isTarget = [3, 4, 10, 11].includes(interval) && chordObj.notes.includes(interval);

                        let cls = 'staff-note';
                        if (isAvoid) cls += ' avoid';
                        if (isChar) cls += ' char';
                        if (this.showTargetNotes && isTarget) cls += ' target';

                        notePositions.push(`<span class="${cls}" style="left:${x}%; top:${Math.min(Math.max(y, 20), 100)}%;"></span>`);
                    });

                    return `
                        <div class="staff-visual" data-scale-key="${scaleKey}" aria-label="Visualisation de la gamme ${scaleDef.name}" tabindex="0">
                            <div class="staff-lines">
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            ${notePositions.join('')}
                        </div>
                    `;
                }

                if (this.visMode === 'intervals') {
                    const intervalNodes = intervals.map((interval) => {
                        const intervalName = getIntervalLabel(interval, chordObj.notes);
                        const isMember = chordObj.notes.includes(interval);
                        const isTarget = [3, 4, 10, 11].includes(interval) && isMember;
                        const isAvoid = avoidNotes.includes(interval);
                        const isChar = characteristicInterval === interval;
                        let klass = 'note-badge';
                        if (isAvoid) klass += ' avoid';
                        else if (isChar) klass += ' char';
                        else if (this.showTargetNotes && isTarget) klass += ' target';
                        return `<button type="button" class="${klass}" data-interval="${interval}">${intervalName}</button>`;
                    });
                    return `<div class="note-badges">${intervalNodes.join('')}</div>`;
                }

                if (this.visMode === 'notes') {
                    const noteNodes = [...spelledNotes, getStrictSpelledNotes(rootName, [12])[0]].map((note, i) => {
                        const interval = i < intervals.length ? intervals[i] : 12;
                        const checkInterval = interval === 12 ? 0 : interval;
                        const isMember = chordObj.notes.includes(checkInterval);
                        const isTarget = [3, 4, 10, 11].includes(checkInterval) && isMember;
                        const isAvoid = avoidNotes.includes(checkInterval);
                        const isChar = characteristicInterval === checkInterval;
                        let klass = 'note-badge';
                        if (isAvoid) klass += ' avoid';
                        else if (isChar) klass += ' char';
                        else if (this.showTargetNotes && isTarget) klass += ' target';
                        return `<button type="button" class="${klass}" data-interval="${interval}">${note}</button>`;
                    });
                    return `<div class="note-badges">${noteNodes.join('')}</div>`;
                }

                const letters = [...spelledNotes, getStrictSpelledNotes(rootName, [12])[0]].map((note, i) => {
                    const interval = i < intervals.length ? intervals[i] : 12;
                    const checkInterval = interval === 12 ? 0 : interval;
                    const isMember = chordObj.notes.includes(checkInterval);
                    const isTarget = [3, 4, 10, 11].includes(checkInterval) && isMember;
                    const isAvoid = avoidNotes.includes(checkInterval);
                    const isChar = characteristicInterval === checkInterval;
                    let klass = 'note-badge';
                    if (isAvoid) klass += ' avoid';
                    else if (isChar) klass += ' char';
                    else if (this.showTargetNotes && isTarget) klass += ' target';
                    return `<button type="button" class="${klass}" data-interval="${interval}">${note}</button>`;
                });
                return `<div class="note-badges">${letters.join('')}</div>`;
            }

            toggleScaleDirection(scaleKey) {
                this.scaleDirections[scaleKey] = !this.scaleDirections[scaleKey];
                this.update();
            }

            async playSingleNote(interval) {
                const piano = await this.loadPiano();
                if (!piano) return;
                const rootIndex = this.selectedRootIndex;
                const noteName = this.getAudioNoteName(rootIndex, interval, 3);
                this.activeAudioNodes.push(piano.play(noteName));
            }

            async playChord() {
                const piano = await this.loadPiano();
                if (!piano) return;
                const chordObj = this.getCurrentChordObj();
                const rootIndex = this.selectedRootIndex;
                const notes = chordObj.notes.map(interval => this.getAudioNoteName(rootIndex, interval, 3));
                notes.forEach((note, index) => {
                    setTimeout(() => {
                        if (this.isLoopMode && this.currentLoopType === 'chord') return;
                        const node = piano.play(note);
                        this.activeAudioNodes.push(node);
                    }, index * 120);
                });
            }

            async playArpeggio() {
                const piano = await this.loadPiano();
                if (!piano) return;
                const chordObj = this.getCurrentChordObj();
                const rootIndex = this.selectedRootIndex;
                const notes = chordObj.notes.map(interval => this.getAudioNoteName(rootIndex, interval, 3));
                notes.forEach((note, index) => {
                    setTimeout(() => {
                        if (this.isLoopMode && this.currentLoopType === 'arpeggio') return;
                        const node = piano.play(note);
                        this.activeAudioNodes.push(node);
                    }, index * 160);
                });
            }

            toggleLoopMode() {
                if (this.isLoopMode) {
                    this.stopLoop();
                    return;
                }

                this.isLoopMode = true;
                this.currentLoopType = 'chord';
                const btn = document.getElementById('loop-chord-btn');
                if (btn) btn.classList.add('active');
                this.updatePlayButtonStates();
                this.loopInterval = setInterval(() => {
                    if (this.currentLoopType === 'chord') {
                        this.playChord();
                    } else {
                        this.playArpeggio();
                    }
                }, 900);
            }

            stopLoop() {
                this.isLoopMode = false;
                this.currentLoopType = null;
                if (this.loopInterval) {
                    clearInterval(this.loopInterval);
                    this.loopInterval = null;
                }
                const btn = document.getElementById('loop-chord-btn');
                if (btn) btn.classList.remove('active');
                this.updatePlayButtonStates();
            }

            updatePlayButtonStates() {
                const chordBtn = document.getElementById('play-chord-btn');
                const arpBtn = document.getElementById('play-arp-btn');
                if (chordBtn) {
                    chordBtn.classList.toggle('active', this.isLoopMode && this.currentLoopType === 'chord');
                }
                if (arpBtn) {
                    arpBtn.classList.toggle('active', this.isLoopMode && this.currentLoopType === 'arpeggio');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.app = new ChordScaleApp();
        });
    </script>
</body>
</html>

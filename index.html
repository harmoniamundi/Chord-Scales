    <script>
        const rootLabels = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
        
        const majorScalesSpelling = {
            "C":  ["C", "D", "E", "F", "G", "A", "B"],
            "Db": ["Db", "Eb", "F", "Gb", "Ab", "Bb", "C"],
            "D":  ["D", "E", "F#", "G", "A", "B", "C#"],
            "Eb": ["Eb", "F", "G", "Ab", "Bb", "C", "D"],
            "E":  ["E", "F#", "G#", "A", "B", "C#", "D#"],
            "F":  ["F", "G", "A", "Bb", "C", "D", "E"],
            "F#": ["F#", "G#", "A#", "B", "C#", "D#", "E#"],
            "Gb": ["Gb", "Ab", "Bb", "Cb", "Db", "Eb", "F"],
            "G":  ["G", "A", "B", "C", "D", "E", "F#"],
            "Ab": ["Ab", "Bb", "C", "Db", "Eb", "F", "G"],
            "A":  ["A", "B", "C#", "D", "E", "F#", "G#"],
            "Bb": ["Bb", "C", "D", "Eb", "F", "G", "A"],
            "B":  ["B", "C#", "D#", "E", "F#", "G#", "A#"]
        };

        function getStrictSpelledNotes(rootName, intervals) {
            const baseLetters = majorScalesSpelling[rootName] || majorScalesSpelling["C"];
            const notesSharpRef = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const notesFlatRef = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
            let rootSemi = 0;
            for(let i=0; i<12; i++) {
                if(notesSharpRef[i] === rootName || notesFlatRef[i] === rootName) {
                    rootSemi = i;
                    break;
                }
            }

            return intervals.map((interval, idx) => {
                const targetSemi = (rootSemi + interval) % 12;
                
                if (intervals.length === 7) {
                    const baseNote = baseLetters[idx];
                    const baseNoteLetter = baseNote[0];
                    const naturalSemis = { 'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11 };
                    const natSemi = naturalSemis[baseNoteLetter];
                    let diff = targetSemi - natSemi;
                    if (diff > 6) diff -= 12;
                    if (diff < -6) diff += 12;

                    let acc = "";
                    if (diff === 1) acc = "#";
                    else if (diff === 2) acc = "##";
                    else if (diff === -1) acc = "b";
                    else if (diff === -2) acc = "bb";

                    const useFlats = rootName.includes('b') || ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'].includes(rootName);
                    if (useFlats) {
                        const flatPreferred = { 1: 'Db', 3: 'Eb', 6: 'Gb', 8: 'Ab', 10: 'Bb' };
                        if (flatPreferred[targetSemi] && flatPreferred[targetSemi][0] === baseNoteLetter) {
                            return flatPreferred[targetSemi];
                        }
                    }
                    return baseNoteLetter + acc;
                } else {
                    const useFlats = rootName.includes('b') || ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'].includes(rootName);
                    return useFlats ? notesFlatRef[targetSemi] : notesSharpRef[targetSemi];
                }
            });
        }

        function getSpelledChordNotes(rootName, chordObj) {
            return getStrictSpelledNotes(rootName, chordObj.notes);
        }

        function getNoteNameWithOctave(rootIndex, interval, baseOctave = 3) {
            const rootName = rootLabels[rootIndex];
            const spelled = getStrictSpelledNotes(rootName, [interval]);
            const absSemis = rootIndex + interval;
            const octaveOffset = Math.floor(absSemis / 12);
            const octave = baseOctave + octaveOffset;
            return spelled[0] + octave;
        }

        function getIntervalLabel(interval, chordNotes) {
            const has = (n) => chordNotes.includes(n);
            const inChord = has(interval);
            const hasMajThird = has(4);
            const hasMinThird = has(3);
            const hasThird = hasMajThird || hasMinThird;

            switch (interval) {
                case 0:  return "1";
                case 1:  return "b9";
                case 2:  return "9";
                case 3:  
                    if (inChord) return "b3";
                    return (hasMajThird && has(10)) ? "#9" : "b3";
                case 4:  return "3";
                case 5:  
                    return (inChord && !hasThird) ? "4" : "11";
                case 6:
                    if (inChord) return has(7) ? "#11" : "b5";
                    return hasMinThird ? "b5" : "#11";
                case 7:  return "5";
                case 8:  return inChord ? "#5" : "b13";
                case 9:  
                    if (inChord) return (hasMinThird && has(6)) ? "bb7" : "6";
                    return "13";
                case 10: return "b7";
                case 11: return "7";
                case 12: return "8";
                default: return String(interval);
            }
        }

        const scalesDb = {

            mixolydian: { name: "Mixolydien", category: "Diatonique / Dominant", intervals: [0, 2, 4, 5, 7, 9, 10], desc: "Sur un V7 classique non altéré (tensions 9, 13)." },
            lydianDominant: { name: "Lydien Dominant (Lydien b7)", category: "Mineur Mélodique", intervals: [0, 2, 4, 6, 7, 9, 10], desc: "Pour les V7 qui ne résolvent pas en quinte juste (Substituts tritoniques, bVII7)." },
            altered: { name: "Altéré (Super Locrien)", category: "Mineur Mélodique", intervals: [0, 1, 3, 4, 6, 8, 10], desc: "Pour V7 résolvant sur un I. Contient toutes les altérations (b9, #9, #11, b13)." },
            mixolydianFlat13: { name: "Mixolydien b13", category: "Mineur Mélodique", intervals: [0, 2, 4, 5, 7, 8, 10], desc: "5ème mode du mineur mélodique." },
            phrygianDominant: { name: "Phrygien Dominant", category: "Mineur Harmonique", intervals: [0, 1, 4, 5, 7, 8, 10], desc: "Pour V7 vers un accord mineur." },
            mixolydianFlat9: { name: "Mixolydien b9", category: "Majeur Harmonique", intervals: [0, 1, 4, 5, 7, 9, 10], desc: "5ème mode du majeur harmonique." },
            dominantBebop: { name: "Bebop Dominante", category: "Bebop", intervals: [0, 2, 4, 5, 7, 9, 10, 11], desc: "Chromatisme entre la septième mineure et la fondamentale." },
            halfWholeDim: { name: "Demi-Ton / Ton (Octatonique)", category: "Symétrique", intervals: [0, 1, 3, 4, 6, 7, 9, 10], desc: "Sur accords 7b9 ou 7#9, garde la quinte juste et la 13e majeure." },
            wholeTone: { name: "Par Tons (Hexatonique)", category: "Symétrique", intervals: [0, 2, 4, 6, 8, 10], desc: "Sur les accords 7#5 (dominantes sans 9ème altérée)." },
            locrianSharp2: { name: "Locrien bécarre 2", category: "Mineur Mélodique", intervals: [0, 2, 3, 5, 6, 8, 10], desc: "Choix moderne par défaut sur le degré II d'un ii-V-I mineur. La seconde majeure sonne mieux que la b2." },
            locrian: { name: "Locrien", category: "Diatonique", intervals: [0, 1, 3, 5, 6, 8, 10], desc: "Degré VII de la gamme majeure." },
            minorPentatonicFlat5: { name: "Pentatonique mineure b5", category: "Pentatonique", intervals: [0, 3, 5, 6, 10], desc: "Version allégée du Locrien." },
            wholeHalfDim: { name: "Ton / Demi-Ton (Octatonique)", category: "Symétrique", intervals: [0, 2, 3, 5, 6, 8, 9, 11], desc: "Option principale, couvre la structure symétrique de l'accord diminué et ajoute une note d'approche." }
        };

        const chordTypes = {
            maj: [
                { id: "maj7", name: "maj7", fullName: "Majeur 7", notes: [0, 4, 7, 11], scales: [{ id: "lydian", role: "Principal (Moderne)" }, { id: "ionian", role: "Degré I" }, { id: "harmonicMajor", role: "Emprunt sombre" }, { id: "majorBebop", role: "Rythmique Bebop" }, { id: "majorPentatonic", role: "Consonance ouverte" }, { id: "majorBlues", role: "Approche bluesy" }] },
                { id: "maj9", name: "maj9", fullName: "Majeur 9", notes: [0, 4, 7, 11, 2], scales: [{ id: "lydian", role: "Principal" }, { id: "ionian", role: "Degré I" }] },
                { id: "6", name: "6", fullName: "Sixte", notes: [0, 4, 7, 9], scales: [{ id: "ionian", role: "Principal" }, { id: "lydian", role: "Moderne" }, { id: "majorBebop", role: "Bebop" }, { id: "majorPentatonic", role: "Consonance" }, { id: "majorBlues", role: "Bluesy" }] },
                { id: "maj7sharp11", name: "maj7(#11)", fullName: "Majeur 7 dièse 11", notes: [0, 4, 7, 11, 6], scales: [{ id: "lydian", role: "Principal" }, { id: "lydianAug", role: "Avancé" }] },
                { id: "maj7sharp5", name: "maj7(#5)", fullName: "Majeur 7 quinte augmentée", notes: [0, 4, 8, 11], scales: [{ id: "lydianAug", role: "Principal (Degré III du min. mél.)" }, { id: "majorBebop", role: "Alternative" }] }
            ],
            min: [
                { id: "m7", name: "m7", fullName: "Mineur 7", notes: [0, 3, 7, 10], scales: [{ id: "dorian", role: "Principal (Degré II)" }, { id: "aeolian", role: "Degré VI (b6 frotte)" }, { id: "phrygian", role: "Degré III (Dissonant)" }, { id: "minorBebop", role: "Approche Bebop" }, { id: "minorPentatonic", role: "Sans frottements" }, { id: "bluesScale", role: "Tension Blues" }] },
                { id: "m9", name: "m9", fullName: "Mineur 9", notes: [0, 3, 7, 10, 2], scales: [{ id: "dorian", role: "Principal" }, { id: "aeolian", role: "Secondaire" }, { id: "minorBebop", role: "Bebop" }] },
                { id: "m11", name: "m11", fullName: "Mineur 11", notes: [0, 3, 7, 10, 2, 5], scales: [{ id: "dorian", role: "Principal" }, { id: "aeolian", role: "Naturel" }] },
                { id: "mmaj7", name: "m(maj7)", fullName: "Mineur-Majeur 7", notes: [0, 3, 7, 11], scales: [{ id: "melodicMinor", role: "Principal (Tonique mineure)" }, { id: "harmonicMinor", role: "Classique marqué" }] }
            ],
            dom: [
                { id: "7", name: "7", fullName: "Dominante 7", notes: [0, 4, 7, 10], scales: [{ id: "mixolydian", role: "Principal (Non altéré)" }, { id: "lydianDominant", role: "Sans résolution juste" }, { id: "mixolydianFlat13", role: "Tendu (b13)" }, { id: "dominantBebop", role: "Bebop" }, { id: "bluesScale", role: "Blues/Rock/Funk" }, { id: "mixolydianFlat9", role: "Mixolydien b9 (Spécifique)" }] },

            ],

        const NOTE_STEP_SECONDS = 0.35;
        const PLAY_BASE_OCTAVE = 3;

        class ChordScaleApp {
            constructor() {
                this.selectedRootIndex = 0;
                this.currentCategory = 'maj';
                this.selectedChordId = 'maj7';
                this.visMode = 'staff';
                
                this.audioCtx = null;
                this.pianoInstrument = null;
                this.reverbInput = null;
                this.activePlaybacks = {};
                this.scaleDirections = {};
                this.activeAudioNodes = [];

                this.initUI();
                this.update();
                this.initAudioContextOnInteraction();
            }

            stopAllSounds() {
                this.activeAudioNodes.forEach(node => {
                    if (node && typeof node.stop === 'function') {
                        node.stop();
                    }
                });
                this.activeAudioNodes = [];

                for (let key in this.activePlaybacks) {
                    this.activePlaybacks[key].timers.forEach(t => clearTimeout(t));
                    document.querySelectorAll(`[data-scale-key="${key}"]`).forEach(el => el.classList.remove('ring-2', 'ring-blue-500'));
                }
                this.activePlaybacks = {};
            }

            initAudioContextOnInteraction() {
                const triggerInit = () => {
                    if (!this.pianoInstrument) {
                        this.loadPiano();
                    }
                    window.removeEventListener('click', triggerInit);
                    window.removeEventListener('keydown', triggerInit);
                };
                window.addEventListener('click', triggerInit);
                window.addEventListener('keydown', triggerInit);
            }

            setupReverb(audioCtx) {
                const convolver = audioCtx.createConvolver();
                const rate = audioCtx.sampleRate;
                const length = rate * 2.2;
                const impulse = audioCtx.createBuffer(2, length, rate);
                const left = impulse.getChannelData(0);
                const right = impulse.getChannelData(1);
                for (let i = 0; i < length; i++) {
                    const decay = Math.exp(-i / (rate * 0.6));
                    left[i] = (Math.random() * 2 - 1) * decay;
                    right[i] = (Math.random() * 2 - 1) * decay;
                }
                convolver.buffer = impulse;

                const wetGain = audioCtx.createGain();
                wetGain.gain.value = 0.3;
                const dryGain = audioCtx.createGain();
                dryGain.gain.value = 0.85;
                const masterGain = audioCtx.createGain();
                masterGain.gain.value = 1.1;

                const inputNode = audioCtx.createGain();
                inputNode.connect(dryGain);
                inputNode.connect(convolver);
                convolver.connect(wetGain);
                dryGain.connect(masterGain);
                wetGain.connect(masterGain);
                masterGain.connect(audioCtx.destination);

                return inputNode;
            }

            loadPiano() {
                if (this.pianoInstrument) return;
                
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!this.audioCtx) {
                    this.audioCtx = new AudioContext();
                }

                this.reverbInput = this.setupReverb(this.audioCtx);

                Soundfont.instrument(this.audioCtx, 'acoustic_grand_piano', { soundfont: 'FluidR3_GM' }).then(instr => {
                    this.pianoInstrument = instr;
                }).catch(err => {
                    console.error("Erreur chargement piano:", err);
                });
            }

            initUI() {
                const rootContainer = document.getElementById('root-buttons-container');
                rootContainer.innerHTML = '';
                
                rootLabels.forEach((note, index) => {
                    const btn = document.createElement('button');
                    btn.className = `py-3 rounded-lg font-semibold text-sm transition border ${index === this.selectedRootIndex ? 'bg-[#2563eb] border-[#2563eb] text-white shadow' : 'bg-[#1a1a1a] border-[#333333] text-slate-300 hover:bg-[#2c2c2e] hover:text-white'}`;
                    btn.textContent = note;
                    btn.onclick = () => {
                        this.selectedRootIndex = index;
                        this.initUI();
                        this.update();
                    };
                    rootContainer.appendChild(btn);
                });

                this.renderQualities();
            }

            setQualityCategory(cat) {
                this.currentCategory = cat;
                ['maj', 'min', 'dom', 'other'].forEach(c => {
                    const btn = document.getElementById(`cat-btn-${c}`);
                    if (c === cat) {
                        btn.className = "flex-1 py-1 rounded-md transition bg-[#3a3a3c] text-white shadow-sm";
                    } else {
                        btn.className = "flex-1 py-1 rounded-md transition text-slate-400 hover:text-white";
                    }
                });
                this.renderQualities();
            }

            setVisMode(mode) {
                this.visMode = mode;
                ['staff', 'intervals', 'notes', 'letters'].forEach(m => {
                    const btn = document.getElementById(`vmode-${m}`);
                    if (m === mode) {
                        btn.className = "py-1 px-2.5 rounded-md transition bg-[#3a3a3c] text-white shadow-sm";
                    } else {
                        btn.className = "py-1 px-2.5 rounded-md transition text-slate-400 hover:text-white";
                    }
                });
                this.update();
            }

            renderQualities() {
                const container = document.getElementById('quality-buttons-container');
                container.innerHTML = '';
                const qualities = chordTypes[this.currentCategory] || [];
                
                if (!qualities.some(q => q.id === this.selectedChordId)) {
                    if (qualities.length > 0) this.selectedChordId = qualities[0].id;
                }

                qualities.forEach(q => {
                    const isSelected = q.id === this.selectedChordId;
                    const btn = document.createElement('button');
                    btn.className = `p-2.5 rounded-lg text-left transition border flex flex-col justify-between ${isSelected ? 'bg-blue-600/20 border-blue-500/80 text-white shadow-sm' : 'bg-[#1a1a1a] border-[#333333] text-slate-300 hover:bg-[#2c2c2e] hover:text-white'}`;
                    btn.innerHTML = `
                        <span class="font-bold text-xs">${q.name}</span>
                        <span class="text-[10px] text-slate-400 mt-0.5 truncate">${q.fullName}</span>
                    `;
                    btn.onclick = () => {
                        this.selectedChordId = q.id;
                        this.renderQualities();
                        this.update();
                    };
                    container.appendChild(btn);
                });
            }

            getCurrentChordObj() {
                for (const cat in chordTypes) {
                    const found = chordTypes[cat].find(q => q.id === this.selectedChordId);
                    if (found) return found;
                }
                return chordTypes.maj[0];
            }

            update() {
                const rootName = rootLabels[this.selectedRootIndex];
                const chordObj = this.getCurrentChordObj();
                const chordNameFull = `${rootName}${chordObj.name}`;

                document.getElementById('selected-root-badge').textContent = rootName;
                document.getElementById('selected-quality-badge').textContent = chordObj.name;
                document.getElementById('display-chord-name').textContent = chordNameFull;

                const chordNotesContainer = document.getElementById('display-chord-notes');
                chordNotesContainer.innerHTML = '';
                
                const chordSpelled = getSpelledChordNotes(rootName, chordObj);
                chordSpelled.forEach((n, idx) => {
                    const interval = chordObj.notes[idx];
                    const badge = document.createElement('span');
                    badge.className = "px-2 py-0.5 bg-[#2563eb] text-white rounded font-mono font-bold cursor-pointer hover:bg-blue-600 transition shadow-sm";
                    badge.textContent = n;
                    badge.onclick = (e) => {
                        e.stopPropagation();
                        this.playSingleNote(interval);
                    };
                    chordNotesContainer.appendChild(badge);
                });

                this.renderScales(chordObj, rootName);
            }

            renderScales(chordObj, rootName) {
                const container = document.getElementById('scales-container');
                container.innerHTML = '';

                const scalesList = chordObj.scales;
                document.getElementById('scales-count-badge').textContent = `${scalesList.length} gammes`;

                scalesList.forEach((item, index) => {
                    const scaleDef = scalesDb[item.id];
                    if (!scaleDef) return;

                    const scaleKey = `${item.id}-${index}`;
                    const isDesc = !!this.scaleDirections[scaleKey];

                    const card = document.createElement('div');
                    card.className = "bg-[#252525] border border-[#333333] hover:border-[#444444] transition rounded-xl p-4 shadow relative group flex flex-col justify-between overflow-hidden";
                    
                    const spelledScaleNotes = getStrictSpelledNotes(rootName, scaleDef.intervals);
                    const fullSpilledNotesWithOctave = [...spelledScaleNotes, getStrictSpelledNotes(rootName, [12])[0]];

                    let visualizationHtml = '';
                    if (this.visMode === 'staff') {
                        const canvasId = `vexflow-canvas-${index}-${item.id}`;
                        visualizationHtml = `
                            <div class="bg-white border border-slate-300 rounded-lg shadow-sm text-slate-900 w-full mx-auto cursor-pointer select-none transition hover:border-blue-500 h-[140px] flex items-center justify-center overflow-hidden relative"
                                 data-scale-key="${scaleKey}"
                                 onclick="app.toggleScalePlayback('${scaleKey}', ${JSON.stringify(scaleDef.intervals)}, '${scaleDef.name}', this)"
                                 oncontextmenu="app.toggleScaleDirection('${scaleKey}', this.closest('.group')); event.preventDefault();">
                                <div id="${canvasId}" class="w-full h-full flex items-center justify-center bg-white relative"></div>
                            </div>
                        `;
                        setTimeout(() => {
                            this.renderVexFlowStaff(canvasId, scaleDef.intervals, rootName, isDesc);
                        }, 50);
                    } else if (this.visMode === 'intervals') {
                        let intervalsHtml = '';
                        scaleDef.intervals.forEach((interval) => {
                            const intervalName = getIntervalLabel(interval, chordObj.notes);
                            const isMember = chordObj.notes.includes(interval);
                            const badgeClass = isMember ? "bg-[#2563eb] text-white shadow-sm" : "bg-[#1a1a1a] text-slate-400 border border-[#333333]";
                            intervalsHtml += `<span onclick="app.playSingleNote(${interval}); event.stopPropagation();" class="px-2.5 py-1.5 text-xs font-mono rounded-lg cursor-pointer transition flex items-center justify-center ${badgeClass}">${intervalName}</span>`;
                        });
                        visualizationHtml = `
                            <div class="bg-transparent border border-[#333333] rounded-lg p-3 shadow-sm text-slate-100 w-full mx-auto cursor-pointer select-none transition hover:border-blue-500"
                                 data-scale-key="${scaleKey}"
                                 onclick="app.toggleScalePlayback('${scaleKey}', ${JSON.stringify(scaleDef.intervals)}, '${scaleDef.name}', this)"
                                 oncontextmenu="app.toggleScaleDirection('${scaleKey}', this.closest('.group')); event.preventDefault();">
                                <div class="flex flex-wrap gap-1.5">${intervalsHtml}</div>
                            </div>
                        `;
                    } else if (this.visMode === 'notes') {
                        let notesHtml = '';
                        fullSpilledNotesWithOctave.forEach((anglo, i) => {
                            const frenchName = this.angloToFrench(anglo);
                            const interval = i < scaleDef.intervals.length ? scaleDef.intervals[i] : 12;
                            const isMember = chordObj.notes.includes(interval);
                            const badgeClass = isMember && i < scaleDef.intervals.length ? "bg-[#2563eb] text-white shadow-sm" : "bg-[#1a1a1a] text-slate-400 border border-[#333333]";
                            notesHtml += `<span onclick="app.playSingleNote(${interval}); event.stopPropagation();" class="px-2.5 py-1.5 text-xs font-mono rounded-lg cursor-pointer transition flex items-center justify-center ${badgeClass}">${frenchName}</span>`;
                        });
                        visualizationHtml = `
                            <div class="bg-transparent border border-[#333333] rounded-lg p-3 shadow-sm text-slate-100 w-full mx-auto cursor-pointer select-none transition hover:border-blue-500"
                                 data-scale-key="${scaleKey}"
                                 onclick="app.toggleScalePlayback('${scaleKey}', ${JSON.stringify(scaleDef.intervals)}, '${scaleDef.name}', this)"
                                 oncontextmenu="app.toggleScaleDirection('${scaleKey}', this.closest('.group')); event.preventDefault();">
                                <div class="flex flex-wrap gap-1.5">${notesHtml}</div>
                            </div>
                        `;
                    } else if (this.visMode === 'letters') {
                        let notesHtml = '';
                        fullSpilledNotesWithOctave.forEach((noteName, i) => {
                            const interval = i < scaleDef.intervals.length ? scaleDef.intervals[i] : 12;
                            const isMember = chordObj.notes.includes(interval);
                            const badgeClass = isMember && i < scaleDef.intervals.length ? "bg-[#2563eb] text-white shadow-sm" : "bg-[#1a1a1a] text-slate-400 border border-[#333333]";
                            notesHtml += `<span onclick="app.playSingleNote(${interval}); event.stopPropagation();" class="px-2.5 py-1.5 text-xs font-mono rounded-lg cursor-pointer transition flex items-center justify-center ${badgeClass}">${noteName}</span>`;
                        });
                        visualizationHtml = `
                            <div class="bg-transparent border border-[#333333] rounded-lg p-3 shadow-sm text-slate-100 w-full mx-auto cursor-pointer select-none transition hover:border-blue-500"
                                 data-scale-key="${scaleKey}"
                                 onclick="app.toggleScalePlayback('${scaleKey}', ${JSON.stringify(scaleDef.intervals)}, '${scaleDef.name}', this)"
                                 oncontextmenu="app.toggleScaleDirection('${scaleKey}', this.closest('.group')); event.preventDefault();">
                                <div class="flex flex-wrap gap-1.5">${notesHtml}</div>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-2">
                                <div>
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <h3 class="font-bold text-sm text-white">${rootName} ${scaleDef.name}</h3>
                                        <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-[#1a1a1a] text-slate-300 border border-[#333333]">${scaleDef.category}</span>
                                    </div>
                                    <div class="flex items-center gap-2 mt-0.5">
                                        <span class="text-xs font-medium text-blue-400">${item.role}</span>
                                        <span class="text-[10px] text-slate-500 scale-dir-badge">• ${isDesc ? 'Descendant' : 'Ascendant'}</span>
                                    </div>
                                </div>
                            </div>
                            <p class="text-xs text-slate-400 mb-3">${scaleDef.desc}</p>
                        </div>
                        <div class="pt-2.5 border-t border-[#333333]">
                            ${visualizationHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            angloToFrench(angloNote) {
                const map = {
                    'C': 'Do', 'C#': 'Do#', 'Cb': 'Dob', 'C##': 'Do##',
                    'D': 'Ré', 'D#': 'Ré#', 'Db': 'Réb', 'D##': 'Ré##',
                    'E': 'Mi', 'E#': 'Mi#', 'Eb': 'Mib', 'E##': 'Mi##',
                    'F': 'Fa', 'F#': 'Fa#', 'Fb': 'Fab', 'F##': 'Fa##',
                    'G': 'Sol', 'G#': 'Sol#', 'Gb': 'Solb', 'G##': 'Sol##',
                    'A': 'La', 'A#': 'La#', 'Ab': 'Lab', 'A##': 'La##',
                    'B': 'Si', 'B#': 'Si#', 'Bb': 'Sib', 'B##': 'Si##'
                };
                return map[angloNote] || angloNote;
            }

            toggleScaleDirection(scaleKey, cardEl) {
                this.scaleDirections[scaleKey] = !this.scaleDirections[scaleKey];
                this.update();
            }

            renderVexFlowStaff(containerId, intervals, rootName, isDesc) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';

                try {
                    let scaleIntervals = [...intervals, 12];
                    let spelledNotes = [
                        ...getStrictSpelledNotes(rootName, intervals),
                        getStrictSpelledNotes(rootName, [12])[0]
                    ];
                    if (isDesc) {
                        scaleIntervals = scaleIntervals.reverse();
                        spelledNotes = spelledNotes.reverse();
                    }

                    const numNotes = scaleIntervals.length;
                    const VEX_WIDTH = Math.max(450, numNotes * 42 + 60);
                    const VEX_HEIGHT = 120;

                    const { Renderer, Stave, StaveNote, Voice, Formatter, Accidental } = Vex.Flow;
                    
                    const renderer = new Renderer(container, Renderer.Backends.SVG);
                    renderer.resize(VEX_WIDTH, VEX_HEIGHT);
                    const context = renderer.getContext();

                    const svgEl = container.querySelector('svg');
                    if (svgEl) {
                        svgEl.style.width = '100%';
                        svgEl.style.height = '100%';
                        svgEl.style.display = 'block';
                        svgEl.style.margin = 'auto';
                        svgEl.style.overflow = 'visible';
                        svgEl.setAttribute('viewBox', `0 0 ${VEX_WIDTH} ${VEX_HEIGHT}`);
                        svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                    }

                    const staveY = 5;
                    const stave = new Stave(10, staveY, VEX_WIDTH - 20);
                    stave.addClef("treble").setContext(context).draw();

                    const CLEF_NOTE_GAP = 22;
                    if (typeof stave.setNoteStartX === 'function') {
                        stave.setNoteStartX(stave.getNoteStartX() + CLEF_NOTE_GAP);
                    }

                    const letterOrder = { 'c': 0, 'd': 1, 'e': 2, 'f': 3, 'g': 4, 'a': 5, 'b': 6 };
                    let currentOctave = 4;
                    let prevLetVal = -1;

                    const staveNotes = spelledNotes.map((spelled, idx) => {
                        const interval = scaleIntervals[idx];
                        const match = spelled.match(/^([A-Ga-g])([#b]*)$/);
                        const letter = match[1].toLowerCase();
                        const accidental = match[2];
                        const letVal = letterOrder[letter];

                        if (idx === 0) {
                            prevLetVal = letVal;
                            currentOctave = isDesc && interval === 12 ? 5 : 4;
                        } else {
                            if (!isDesc && interval === 12) {
                                currentOctave = 5;
                            } else if (isDesc && interval === 0) {
                                currentOctave = 4;
                            } else if (!isDesc && letVal < prevLetVal) {
                                currentOctave++;
                            } else if (isDesc && letVal > prevLetVal) {
                                currentOctave--;
                            }
                            prevLetVal = letVal;
                        }

                        const note = new StaveNote({
                            keys: [`${letter}/${currentOctave}`],
                            duration: "q"
                        });

                        if (accidental) {
                            note.addModifier(new Accidental(accidental), 0);
                        }

                        return note;
                    });

                    const voice = new Voice({ num_beats: scaleIntervals.length, beat_value: 4 });
                    voice.addTickables(staveNotes);

                    const formatter = new Formatter();
                    formatter.formatToStave([voice], stave);
                    voice.draw(context, stave);

                    const noteElements = container.querySelectorAll('.vf-stavenote');
                    noteElements.forEach((el, i) => {
                        el.style.cursor = 'pointer';
                        el.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (i < scaleIntervals.length) {
                                this.playSingleNote(scaleIntervals[i]);
                            }
                        });
                    });

                } catch(e) {
                    console.error("VexFlow render error:", e);
                    container.innerHTML = `<span class="text-xs text-rose-500">Erreur de rendu</span>`;
                }
            }

            toggleScalePlayback(scaleKey, intervals, scaleName, containerEl) {
                if (!this.pianoInstrument) {
                    this.loadPiano();
                    return;
                }
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }

                const wasPlaying = !!this.activePlaybacks[scaleKey];
                this.stopAllSounds();

                if (wasPlaying) {
                    return;
                }

                const isDesc = !!this.scaleDirections[scaleKey];
                let playIntervals = [...intervals, 12];
                if (isDesc) {
                    playIntervals = playIntervals.reverse();
                }

                this.activePlaybacks[scaleKey] = { timers: [] };
                if (containerEl) {
                    containerEl.classList.add('ring-2', 'ring-blue-500');
                }

                playIntervals.forEach((interval, idx) => {
                    const noteStr = getNoteNameWithOctave(this.selectedRootIndex, interval, PLAY_BASE_OCTAVE);
                    const timer = setTimeout(() => {
                        try {
                            if (this.pianoInstrument) {
                                const node = this.pianoInstrument.play(noteStr, this.audioCtx.currentTime, { duration: 1.0, destination: this.reverbInput });
                                this.activeAudioNodes.push(node);
                            }
                        } catch(e) {}
                    }, idx * NOTE_STEP_SECONDS * 1000);
                    this.activePlaybacks[scaleKey].timers.push(timer);
                });

                const endTimer = setTimeout(() => {
                    delete this.activePlaybacks[scaleKey];
                    if (containerEl) containerEl.classList.remove('ring-2', 'ring-blue-500');
                }, playIntervals.length * NOTE_STEP_SECONDS * 1000);
                this.activePlaybacks[scaleKey].timers.push(endTimer);
            }

            playSingleNote(interval) {
                this.stopAllSounds();
                if (!this.pianoInstrument) {
                    this.loadPiano();
                    return;
                }
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                const noteStr = getNoteNameWithOctave(this.selectedRootIndex, interval, PLAY_BASE_OCTAVE);
                try {
                    const node = this.pianoInstrument.play(noteStr, this.audioCtx.currentTime, { duration: 1.5, destination: this.reverbInput });
                    this.activeAudioNodes.push(node);
                } catch(e) {}
            }

            playChord() {
                this.stopAllSounds();
                if (!this.pianoInstrument) {
                    this.loadPiano();
                    return;
                }
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }

                const chordObj = this.getCurrentChordObj();
                const now = this.audioCtx ? this.audioCtx.currentTime : 0;

                chordObj.notes.forEach((interval, idx) => {
                    const noteStr = getNoteNameWithOctave(this.selectedRootIndex, interval, PLAY_BASE_OCTAVE);
                    try {
                        const node = this.pianoInstrument.play(noteStr, now + (idx * 0.04), { duration: 2.2, destination: this.reverbInput });
                        this.activeAudioNodes.push(node);
                    } catch(e) {}
                });
            }

            playArpeggio() {
                this.stopAllSounds();
                if (!this.pianoInstrument) {
                    this.loadPiano();
                    return;
                }
                if (this.audioCtx && this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }

                const chordObj = this.getCurrentChordObj();
                const now = this.audioCtx ? this.audioCtx.currentTime : 0;

                const lastIdx = chordObj.notes.length - 1;
                chordObj.notes.forEach((interval, idx) => {
                    const noteStr = getNoteNameWithOctave(this.selectedRootIndex, interval, PLAY_BASE_OCTAVE);
                    try {
                        const node = this.pianoInstrument.play(noteStr, now + (idx * NOTE_STEP_SECONDS), { duration: idx === lastIdx ? 2.2 : 1.8, destination: this.reverbInput });
                        this.activeAudioNodes.push(node);
                    } catch(e) {}
                });
            }
        }

        const app = new ChordScaleApp();
    </script>
</body>
